<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=5,
               viewport-fit=cover">

<title>Bybit Order Flow</title>

<style>
:root{
  --bg:#070b11;
  --panel:#0d131c;
  --panel2:#111923;
  --border:#1d2a38;
  --text:#e8edf3;
  --muted:#8795a5;
  --green:#19d47b;
  --red:#ff4d61;
  --blue:#42a5ff;
  --yellow:#f4c84b;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    Arial,
    "Tahoma",
    sans-serif;
}

body{
  overflow-x:hidden;
}

button,
select{
  font:inherit;
}

.app{
  width:100%;
  min-height:100vh;
  background:var(--bg);
}

/* TOP */

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  gap:8px;
  align-items:center;
  padding:
    calc(8px + env(safe-area-inset-top))
    10px
    8px;
  background:
    rgba(7,11,17,.96);
  border-bottom:
    1px solid var(--border);
  backdrop-filter:blur(10px);
}

.logo{
  font-weight:900;
  white-space:nowrap;
  font-size:15px;
}

.control{
  min-width:0;
  flex:1;
}

.control select{
  width:100%;
  height:38px;
  color:var(--text);
  background:var(--panel2);
  border:
    1px solid var(--border);
  border-radius:9px;
  padding:0 9px;
  outline:none;
}

.status{
  display:flex;
  align-items:center;
  gap:5px;
  white-space:nowrap;
  font-size:11px;
  color:var(--green);
}

/* NAV */

.nav{
  position:sticky;
  top:58px;
  z-index:45;
  display:flex;
  gap:6px;
  padding:7px 8px;
  background:rgba(7,11,17,.94);
  border-bottom:
    1px solid var(--border);
  overflow-x:auto;
}

.nav::-webkit-scrollbar{
  display:none;
}

.nav button{
  flex:0 0 auto;
  min-width:62px;
  height:42px;
  border:
    1px solid var(--border);
  border-radius:10px;
  color:var(--muted);
  background:var(--panel);
  cursor:pointer;
}

.nav button.active{
  color:white;
  border-color:var(--blue);
  background:#102338;
}

.nav .icon{
  display:block;
  font-size:18px;
}

.nav .label{
  display:block;
  font-size:9px;
  margin-top:2px;
}

/* CHART */

.chart-wrap{
  width:100%;
  padding:8px;
}

.chart-card{
  position:relative;
  width:100%;
  height:58vh;
  min-height:360px;
  max-height:760px;
  overflow:hidden;
  background:
    linear-gradient(
      180deg,
      #0b1119,
      #080d14
    );
  border:
    1px solid var(--border);
  border-radius:12px;
  touch-action:none;
}

#chart{
  width:100%;
  height:100%;
  display:block;
}

/* PANEL */

.panel{
  margin:0 8px 20px;
  border:
    1px solid var(--border);
  border-radius:12px;
  background:var(--panel);
  overflow:hidden;
}

.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  border-bottom:
    1px solid var(--border);
}

.panel-title{
  font-weight:900;
  font-size:14px;
}

.panel-sub{
  color:var(--muted);
  font-size:10px;
}

#panelContent{
  padding:10px;
}

/* SUMMARY */

.summary{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:6px;
  margin-bottom:10px;
}

.stat{
  background:var(--panel2);
  border:
    1px solid var(--border);
  border-radius:8px;
  padding:7px;
  text-align:center;
}

.stat .k{
  color:var(--muted);
  font-size:9px;
}

.stat .v{
  margin-top:4px;
  font-size:12px;
  font-weight:900;
}

.buy{
  color:var(--green)!important;
}

.sell{
  color:var(--red)!important;
}

/* FOOTPRINT */

.fp-scroll{
  width:100%;
  overflow:auto;
  direction:ltr;
  touch-action:pan-x pan-y;
  border:
    1px solid var(--border);
  border-radius:9px;
}

.fp{
  position:relative;
  min-width:650px;
  padding:8px;
  direction:ltr;
}

.fp-row{
  display:grid;
  grid-template-columns:
    110px
    130px
    130px
    110px
    110px;
  min-height:27px;
  align-items:center;
  border-bottom:
    1px solid rgba(255,255,255,.035);
}

.fp-row.head{
  color:var(--muted);
  font-size:9px;
  position:sticky;
  top:0;
  background:var(--panel);
}

.fp-cell{
  position:relative;
  min-height:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:700;
}

.price{
  color:#dce5ee;
}

.bid{
  color:var(--red);
}

.ask{
  color:var(--green);
}

.delta{
  font-weight:900;
}

.delta.pos{
  color:var(--green);
}

.delta.neg{
  color:var(--red);
}

.volume{
  position:relative;
  padding:0 8px;
}

.volume-bar{
  position:absolute;
  top:4px;
  bottom:4px;
  right:3px;
  opacity:.16;
  border-radius:3px;
}

.volume-text{
  position:relative;
  z-index:1;
}

.imbalance-buy{
  background:
    rgba(25,212,123,.13);
}

.imbalance-sell{
  background:
    rgba(255,77,97,.13);
}

.poc{
  outline:
    1px solid var(--yellow);
  background:
    rgba(244,200,75,.08);
}

/* OTHER PANELS */

.placeholder{
  padding:30px 15px;
  text-align:center;
  color:var(--muted);
}

.placeholder strong{
  display:block;
  color:white;
  margin-bottom:8px;
}

/* LANDSCAPE */

@media (orientation:landscape){
  .chart-card{
    height:78vh;
    max-height:none;
    min-height:280px;
  }

  .nav{
    top:54px;
  }

  .topbar{
    padding-top:6px;
    padding-bottom:6px;
  }
}

/* SMALL */

@media(max-width:600px){
  .logo{
    display:none;
  }

  .summary{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .chart-card{
    height:56vh;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP -->
  <header class="topbar">

    <div class="logo">
      📊 Order Flow
    </div>

    <div class="control">
      <select id="category">
        <option value="linear">
          Futures
        </option>
        <option value="spot">
          Spot
        </option>
      </select>
    </div>

    <div class="control">
      <select id="symbol">
        <option>
          BTCUSDT
        </option>
      </select>
    </div>

    <div class="control">
      <select id="interval">
        <option value="1">1m</option>
        <option value="3">3m</option>
        <option value="5">5m</option>
        <option value="15">15m</option>
        <option value="30">30m</option>
        <option value="60">1H</option>
      </select>
    </div>

    <div class="status"
         id="status">
      🟡 اتصال...
    </div>

  </header>

  <!-- ICONS -->
  <nav class="nav">

    <button
      class="active"
      data-panel="footprint">
      <span class="icon">🧱</span>
      <span class="label">Footprint</span>
    </button>

    <button data-panel="heatmap">
      <span class="icon">🔥</span>
      <span class="label">Heatmap</span>
    </button>

    <button data-panel="liquidity">
      <span class="icon">💧</span>
      <span class="label">Liquidity</span>
    </button>

    <button data-panel="absorption">
      <span class="icon">🧲</span>
      <span class="label">Absorption</span>
    </button>

    <button data-panel="orderbook">
      <span class="icon">📖</span>
      <span class="label">Order Book</span>
    </button>

    <button data-panel="delta">
      <span class="icon">Δ</span>
      <span class="label">Delta/CVD</span>
    </button>

    <button data-panel="large">
      <span class="icon">🐋</span>
      <span class="label">Large Trades</span>
    </button>

  </nav>

  <!-- FIXED CHART -->
  <main class="chart-wrap">

    <div
      class="chart-card"
      id="chartCard">

      <canvas id="chart"></canvas>

    </div>

  </main>

  <!-- INFORMATION -->
  <section class="panel">

    <div class="panel-head">

      <div>
        <div
          class="panel-title"
          id="panelTitle">
          🧱 Footprint
        </div>

        <div
          class="panel-sub"
          id="panelSub">
          کندل را لمس کنید
        </div>
      </div>

      <div
        id="selectedTime"
        class="panel-sub">
        —
      </div>

    </div>

    <div id="panelContent"></div>

  </section>

</div>

<script>
"use strict";

/* =====================================================
   CONFIG
===================================================== */

const API = "";

const state = {
  category: "linear",
  symbol: "BTCUSDT",
  interval: "1",

  candles: [],
  selectedIndex: -1,
  selectedFootprint: null,

  tickSize: 0.01,
  priceDecimals: 2,

  zoom: 1,
  offset: 0,

  panel: "footprint",

  ws: null,
  wsConnected: false,

  liveTrades: [],

  cvd: 0
};

/* =====================================================
   DOM
===================================================== */

const $ = id =>
  document.getElementById(id);

const canvas =
  $("chart");

const ctx =
  canvas.getContext("2d");

const chartCard =
  $("chartCard");

/* =====================================================
   FORMAT
===================================================== */

function fmt(v, digits = 2){
  if (!Number.isFinite(v))
    return "—";

  return Number(v).toLocaleString(
    "en-US",
    {
      maximumFractionDigits:
        digits
    }
  );
}

function fmtPrice(v){
  return Number(v).toFixed(
    state.priceDecimals
  );
}

function fmtTime(ms){
  if (!ms)
    return "—";

  return new Date(ms)
    .toLocaleString(
      "fa-IR",
      {
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      }
    );
}

/* =====================================================
   STATUS
===================================================== */

function setStatus(text, color){
  const el = $("status");

  el.textContent = text;

  el.style.color =
    color ||
    "var(--green)";
}

/* =====================================================
   API
===================================================== */

async function api(path, params = {}){
  const qs =
    new URLSearchParams(params)
      .toString();

  const url =
    `${API}${path}?${qs}`;

  const r =
    await fetch(url, {
      cache:"no-store"
    });

  const data =
    await r.json();

  if (!data.ok){
    throw new Error(
      data.error ||
      "API Error"
    );
  }

  return data;
}

/* =====================================================
   LOAD SYMBOLS
===================================================== */

async function loadSymbols(){

  setStatus(
    "🟡 دریافت ارزها...",
    "var(--yellow)"
  );

  const data =
    await api(
      "/api/symbols",
      {
        category:
          state.category
      }
    );

  const select =
    $("symbol");

  const old =
    state.symbol;

  select.innerHTML = "";

  for (const s of data.symbols){

    const opt =
      document.createElement(
        "option"
      );

    opt.value =
      s.symbol;

    opt.textContent =
      s.symbol;

    select.appendChild(
      opt
    );
  }

  if (
    data.symbols.some(
      x => x.symbol === old
    )
  ){
    select.value = old;
  } else {
    select.value =
      data.symbols[0]?.symbol ||
      "BTCUSDT";

    state.symbol =
      select.value;
  }
}

/* =====================================================
   LOAD MARKET
===================================================== */

async function loadMarket(){

  setStatus(
    "🟡 دریافت داده...",
    "var(--yellow)"
  );

  const data =
    await api(
      "/api/market",
      {
        category:
          state.category,
        symbol:
          state.symbol,
        interval:
          state.interval
      }
    );

  const m =
    data.data;

  state.candles =
    m.candles || [];

  state.tickSize =
    Number(m.tickSize) || 0.01;

  state.priceDecimals =
    Number(m.priceDecimals) || 2;

  state.selectedIndex =
    state.candles.length - 1;

  state.zoom = 1;
  state.offset = 0;

  setStatus(
    "🟢 Bybit",
    "var(--green)"
  );

  drawChart();

  await loadSelectedFootprint();

  connectWebSocket();
}

/* =====================================================
   LOAD FOOTPRINT
===================================================== */

async function loadSelectedFootprint(){

  if (
    state.selectedIndex < 0 ||
    !state.candles.length
  ){
    return;
  }

  const candle =
    state.candles[
      state.selectedIndex
    ];

  const data =
    await api(
      "/api/footprint",
      {
        category:
          state.category,
        symbol:
          state.symbol,
        interval:
          state.interval
      }
    );

  const list =
    data.data?.candles || [];

  const match =
    list.find(
      x =>
        Number(x.time) ===
        Number(candle.time)
    );

  state.selectedFootprint =
    match?.footprint || null;

  renderPanel();
}

/* =====================================================
   CANVAS SIZE
===================================================== */

function resizeCanvas(){

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    Math.floor(
      rect.width * dpr
    );

  canvas.height =
    Math.floor(
      rect.height * dpr
    );

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  drawChart();
}

window.addEventListener(
  "resize",
  resizeCanvas
);

window.addEventListener(
  "orientationchange",
  () => {
    setTimeout(
      resizeCanvas,
      250
    );
  }
);

/* =====================================================
   CHART
===================================================== */

function drawChart(){

  const rect =
    canvas.getBoundingClientRect();

  const W =
    rect.width;

  const H =
    rect.height;

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  if (
    !state.candles.length
  ){
    drawText(
      "در حال دریافت داده...",
      W / 2,
      H / 2,
      14,
      "#8795a5"
    );

    return;
  }

  const left = 8;
  const right = 72;
  const top = 15;
  const bottom = 34;

  const cw =
    W - left - right;

  const ch =
    H - top - bottom;

  const visible =
    Math.max(
      12,
      Math.floor(
        70 / state.zoom
      )
    );

  const maxVisible =
    Math.min(
      visible,
      state.candles.length
    );

  let end =
    state.candles.length -
    Math.round(state.offset);

  end =
    Math.max(
      maxVisible,
      Math.min(
        state.candles.length,
        end
      )
    );

  let start =
    Math.max(
      0,
      end - maxVisible
    );

  const arr =
    state.candles.slice(
      start,
      end
    );

  if (!arr.length)
    return;

  let min =
    Infinity;

  let max =
    -Infinity;

  for (const c of arr){

    min =
      Math.min(
        min,
        c.low
      );

    max =
      Math.max(
        max,
        c.high
      );
  }

  const pad =
    (max - min) * .08 ||
    Math.max(
      1,
      max * .001
    );

  min -= pad;
  max += pad;

  drawGrid(
    left,
    top,
    cw,
    ch,
    min,
    max
  );

  const gap =
    cw / arr.length;

  const body =
    Math.max(
      2,
      Math.min(
        18,
        gap * .65
      )
    );

  arr.forEach(
    (c, i) => {

      const x =
        left +
        gap * i +
        gap / 2;

      const yHigh =
        priceY(
          c.high,
          min,
          max,
          top,
          ch
        );

      const yLow =
        priceY(
          c.low,
          min,
          max,
          top,
          ch
        );

      const yOpen =
        priceY(
          c.open,
          min,
          max,
          top,
          ch
        );

      const yClose =
        priceY(
          c.close,
          min,
          max,
          top,
          ch
        );

      const up =
        c.close >= c.open;

      const color =
        up
          ? "#19d47b"
          : "#ff4d61";

      ctx.strokeStyle =
        color;

      ctx.lineWidth = 1;

      ctx.beginPath();

      ctx.moveTo(
        x,
        yHigh
      );

      ctx.lineTo(
        x,
        yLow
      );

      ctx.stroke();

      const y =
        Math.min(
          yOpen,
          yClose
        );

      const h =
        Math.max(
          1,
          Math.abs(
            yClose - yOpen
          )
        );

      ctx.fillStyle =
        color;

      ctx.fillRect(
        x - body / 2,
        y,
        body,
        h
      );

      const realIndex =
        start + i;

      if (
        realIndex ===
        state.selectedIndex
      ){

        ctx.strokeStyle =
          "#f4c84b";

        ctx.lineWidth = 2;

        ctx.strokeRect(
          x - body,
          yHigh - 3,
          body * 2,
          yLow - yHigh + 6
        );
      }
    }
  );

  drawYAxis(
    left + cw,
    top,
    ch,
    min,
    max
  );

  drawXAxis(
    left,
    top + ch,
    cw,
    arr
  );
}

function priceY(
  price,
  min,
  max,
  top,
  h
){
  return (
    top +
    (max - price) /
    (max - min) *
    h
  );
}

/* =====================================================
   GRID
===================================================== */

function drawGrid(
  x,
  y,
  w,
  h,
  min,
  max
){

  ctx.strokeStyle =
    "rgba(255,255,255,.045)";

  ctx.lineWidth = 1;

  const rows = 7;

  for (
    let i = 0;
    i <= rows;
    i++
  ){

    const yy =
      y +
      h *
      i / rows;

    ctx.beginPath();

    ctx.moveTo(
      x,
      yy
    );

    ctx.lineTo(
      x + w,
      yy
    );

    ctx.stroke();
  }

  const cols = 8;

  for (
    let i = 0;
    i <= cols;
    i++
  ){

    const xx =
      x +
      w *
      i / cols;

    ctx.beginPath();

    ctx.moveTo(
      xx,
      y
    );

    ctx.lineTo(
      xx,
      y + h
    );

    ctx.stroke();
  }
}

/* =====================================================
   Y AXIS
===================================================== */

function drawYAxis(
  x,
  y,
  h,
  min,
  max
){

  ctx.fillStyle =
    "#8795a5";

  ctx.font =
    "10px Arial";

  ctx.textAlign =
    "left";

  const rows = 7;

  for (
    let i = 0;
    i <= rows;
    i++
  ){

    const p =
      max -
      (max - min) *
      i / rows;

    const yy =
      y +
      h *
      i / rows;

    ctx.fillText(
      fmtPrice(p),
      x + 7,
      yy + 3
    );
  }
}

/* =====================================================
   X AXIS
===================================================== */

function drawXAxis(
  x,
  y,
  w,
  arr
){

  ctx.fillStyle =
    "#8795a5";

  ctx.font =
    "10px Arial";

  ctx.textAlign =
    "center";

  if (!arr.length)
    return;

  const count =
    Math.min(
      7,
      arr.length
    );

  for (
    let i = 0;
    i < count;
    i++
  ){

    const index =
      Math.floor(
        i *
        (arr.length - 1) /
        Math.max(
          1,
          count - 1
        )
      );

    const c =
      arr[index];

    const xx =
      x +
      w *
      index /
      Math.max(
        1,
        arr.length - 1
      );

    const d =
      new Date(
        c.time
      );

    const label =
      d.toLocaleTimeString(
        "fa-IR",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

    ctx.fillText(
      label,
      xx,
      y + 20
    );
  }
}

function drawText(
  text,
  x,
  y,
  size,
  color
){

  ctx.fillStyle =
    color;

  ctx.font =
    `${size}px Arial`;

  ctx.textAlign =
    "center";

  ctx.fillText(
    text,
    x,
    y
  );
}

/* =====================================================
   TOUCH / MOUSE
===================================================== */

let pointerStart = null;
let pinchStart = null;

chartCard.addEventListener(
  "pointerdown",
  e => {

    chartCard.setPointerCapture(
      e.pointerId
    );

    pointerStart = {
      x:e.clientX,
      y:e.clientY,
      offset:state.offset,
      time:Date.now()
    };
  }
);

chartCard.addEventListener(
  "pointermove",
  e => {

    if (!pointerStart)
      return;

    const dx =
      e.clientX -
      pointerStart.x;

    const rect =
      chartCard.getBoundingClientRect();

    const visible =
      Math.max(
        12,
        Math.floor(
          70 / state.zoom
        )
      );

    const candlesPerPixel =
      visible /
      rect.width;

    state.offset =
      pointerStart.offset +
      dx *
      candlesPerPixel;

    state.offset =
      Math.max(
        0,
        Math.min(
          state.candles.length - 1,
          state.offset
        )
      );

    drawChart();
  }
);

chartCard.addEventListener(
  "pointerup",
  e => {

    if (!pointerStart)
      return;

    const dx =
      e.clientX -
      pointerStart.x;

    const dy =
      e.clientY -
      pointerStart.y;

    const elapsed =
      Date.now() -
      pointerStart.time;

    const moved =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    pointerStart = null;

    if (
      moved < 12 &&
      elapsed < 500
    ){
      selectCandle(
        e.clientX,
        e.clientY
      );
    }
  }
);

chartCard.addEventListener(
  "wheel",
  e => {

    e.preventDefault();

    const factor =
      e.deltaY < 0
        ? 1.15
        : .87;

    state.zoom =
      Math.max(
        .5,
        Math.min(
          8,
          state.zoom *
          factor
        )
      );

    drawChart();
  },
  {
    passive:false
  }
);

/* PINCH */

let touches = new Map();

chartCard.addEventListener(
  "pointerdown",
  e => {
    touches.set(
      e.pointerId,
      {
        x:e.clientX,
        y:e.clientY
      }
    );

    if (touches.size === 2){

      const a =
        [...touches.values()][0];

      const b =
        [...touches.values()][1];

      pinchStart =
        Math.hypot(
          a.x-b.x,
          a.y-b.y
        );
    }
  }
);

chartCard.addEventListener(
  "pointermove",
  e => {

    if (!touches.has(
      e.pointerId
    ))
      return;

    touches.set(
      e.pointerId,
      {
        x:e.clientX,
        y:e.clientY
      }
    );

    if (
      touches.size === 2 &&
      pinchStart
    ){

      const a =
        [...touches.values()][0];

      const b =
        [...touches.values()][1];

      const d =
        Math.hypot(
          a.x-b.x,
          a.y-b.y
        );

      const factor =
        d / pinchStart;

      state.zoom =
        Math.max(
          .5,
          Math.min(
            8,
            state.zoom *
            factor
          )
        );

      pinchStart = d;

      drawChart();
    }
  }
);

chartCard.addEventListener(
  "pointerup",
  e => {

    touches.delete(
      e.pointerId
    );

    if (
      touches.size < 2
    ){
      pinchStart = null;
    }
  }
);

/* =====================================================
   SELECT CANDLE
===================================================== */

async function selectCandle(
  clientX,
  clientY
){

  const rect =
    chartCard.getBoundingClientRect();

  const x =
    clientX -
    rect.left;

  const W =
    rect.width;

  const left = 8;
  const right = 72;

  const cw =
    W -
    left -
    right;

  const visible =
    Math.max(
      12,
      Math.floor(
        70 / state.zoom
      )
    );

  const end =
    Math.max(
      visible,
      Math.min(
        state.candles.length,
        state.candles.length -
        Math.round(state.offset)
      )
    );

  const start =
    Math.max(
      0,
      end - visible
    );

  const local =
    Math.floor(
      (x - left) /
      (cw / visible)
    );

  const index =
    Math.max(
      start,
      Math.min(
        end - 1,
        start + local
      )
    );

  state.selectedIndex =
    index;

  drawChart();

  await loadSelectedFootprint();
}

/* =====================================================
   BYBIT PUBLIC WEBSOCKET
===================================================== */

function connectWebSocket(){

  if (state.ws){

    try{
      state.ws.close();
    }catch(_){}
  }

  const ws =
    new WebSocket(
      "wss://stream.bybit.com/v5/public/linear"
    );

  state.ws =
    ws;

  ws.onopen = () => {

    state.wsConnected =
      true;

    setStatus(
      "🟢 Bybit Live",
      "var(--green)"
    );

    ws.send(
      JSON.stringify({
        op:"subscribe",
        args:[
          `publicTrade.${state.symbol}`,
          `kline.${state.interval}.${state.symbol}`
        ]
      })
    );
  };

  ws.onmessage = event => {

    try{

      const msg =
        JSON.parse(
          event.data
        );

      if (
        msg.topic?.startsWith(
          "publicTrade."
        )
      ){

        handleLiveTrade(
          msg.data || []
        );
      }

      if (
        msg.topic?.startsWith(
          "kline."
        )
      ){

        handleLiveKline(
          msg.data || []
        );
      }

    }catch(err){

      console.error(
        "WS message",
        err
      );
    }
  };

  ws.onerror = () => {

    state.wsConnected =
      false;

    setStatus(
      "🟡 Live reconnect...",
      "var(--yellow)"
    );
  };

  ws.onclose = () => {

    state.wsConnected =
      false;

    setTimeout(
      () => {

        if (
          state.symbol &&
          state.ws === ws
        ){
          connectWebSocket();
        }

      },
      3000
    );
  };
}

/* =====================================================
   LIVE TRADES
===================================================== */

function handleLiveTrade(
  trades
){

  for (const t of trades){

    const trade = {
      time:
        Number(t.T),
      price:
        Number(t.p),
      size:
        Number(t.v),
      side:
        String(t.S || "")
          .toLowerCase()
    };

    state.liveTrades.push(
      trade
    );

    if (
      trade.side ===
      "buy"
    ){
      state.cvd +=
        trade.size;
    } else {
      state.cvd -=
        trade.size;
    }
  }

  const cutoff =
    Date.now() -
    24 * 60 * 60 * 1000;

  state.liveTrades =
    state.liveTrades.filter(
      x => x.time >= cutoff
    );

  updateCurrentCandle();

  if (
    state.panel ===
    "footprint"
  ){
    renderLiveFootprint();
  }
}

/* =====================================================
   LIVE KLINE
===================================================== */

function handleLiveKline(
  rows
){

  for (const k of rows){

    const time =
      Number(k.start);

    const candle = {
      time,
      open:
        Number(k.open),
      high:
        Number(k.high),
      low:
        Number(k.low),
      close:
        Number(k.close),
      volume:
        Number(k.volume),
      turnover:
        Number(k.turnover)
    };

    const i =
      state.candles.findIndex(
        x =>
          Number(x.time) ===
          time
      );

    if (i >= 0){

      state.candles[i] =
        candle;

    } else {

      state.candles.push(
        candle
      );

      state.candles.sort(
        (a,b) =>
          a.time - b.time
      );
    }
  }

  if (
    state.selectedIndex <
    0
  ){
    state.selectedIndex =
      state.candles.length - 1;
  }

  drawChart();
}

function updateCurrentCandle(){

  if (
    !state.liveTrades.length
  )
    return;

  const last =
    state.liveTrades[
      state.liveTrades.length - 1
    ];

  const seconds =
    Number(
      TF_MAP[state.interval]
    );

  if (!seconds)
    return;

  const bucket =
    Math.floor(
      last.time /
      (seconds * 1000)
    ) *
    seconds *
    1000;

  let c =
    state.candles.find(
      x =>
        x.time === bucket
    );

  if (!c){

    c = {
      time:bucket,
      open:last.price,
      high:last.price,
      low:last.price,
      close:last.price,
      volume:0,
      turnover:0
    };

    state.candles.push(c);

    state.candles.sort(
      (a,b) =>
        a.time-b.time
    );
  }

  c.high =
    Math.max(
      c.high,
      last.price
    );

  c.low =
    Math.min(
      c.low,
      last.price
    );

  c.close =
    last.price;

  c.volume +=
    last.size;

  c.turnover +=
    last.price *
    last.size;
}

/* =====================================================
   LIVE FOOTPRINT
===================================================== */

function renderLiveFootprint(){

  if (
    state.selectedIndex !==
    state.candles.length - 1
  ){
    return;
  }

  const c =
    state.candles[
      state.selectedIndex
    ];

  if (!c)
    return;

  const start =
    c.time;

  const end =
    c.time +
    Number(
      TF_MAP[state.interval]
    ) *
    1000;

  const trades =
    state.liveTrades.filter(
      t =>
        t.time >= start &&
        t.time < end
    );

  if (!trades.length)
    return;

  const fp =
    buildClientFootprint(
      c,
      trades
    );

  state.selectedFootprint =
    fp;

  renderPanel();
}

function buildClientFootprint(
  candle,
  trades
){

  const map =
    new Map();

  for (
    const t of trades
  ){

    const price =
      roundToStep(
        t.price,
        state.tickSize
      );

    const key =
      price.toFixed(12);

    if (!map.has(key)){

      map.set(
        key,
        {
          price,
          bid:0,
          ask:0,
          totalVolume:0,
          trades:0
        }
      );
    }

    const r =
      map.get(key);

    if (
      t.side ===
      "buy"
    ){
      r.ask +=
        t.size;
    } else {
      r.bid +=
        t.size;
    }

    r.totalVolume +=
      t.size;

    r.trades++;
  }

  const levels =
    [...map.values()]
      .sort(
        (a,b) =>
          b.price-a.price
      )
      .map(
        x => ({
          ...x,
          delta:
            x.ask-x.bid,
          deltaPercent:
            x.totalVolume
              ? (
                (x.ask-x.bid) /
                x.totalVolume
              ) * 100
              : 0
        })
      );

  let buy = 0;
  let sell = 0;
  let volume = 0;
  let poc = null;
  let max = -1;

  for (
    const l of levels
  ){

    buy += l.ask;
    sell += l.bid;
    volume +=
      l.totalVolume;

    if (
      l.totalVolume >
      max
    ){

      max =
        l.totalVolume;

      poc =
        l.price;
    }
  }

  return {
    candleTime:
      candle.time,

    levels,

    summary:{
      buyVolume:buy,
      sellVolume:sell,
      volume,
      delta:
        buy-sell,
      deltaPercent:
        volume
          ? (
            (buy-sell) /
            volume
          ) * 100
          : 0,
      trades:
        trades.length,
      poc,
      vah:
        levels.length
          ? levels[0].price
          : null,
      val:
        levels.length
          ? levels[
              levels.length-1
            ].price
          : null
    },

    imbalance:{
      buy:[],
      sell:[],
      stackedBuy:[],
      stackedSell:[]
    }
  };
}
