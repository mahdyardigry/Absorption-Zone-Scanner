<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>
<meta

>
<meta
  http-equiv="Pragma"

<title>Absorption Zone Scanner</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  background:#080b10;
  color:#e8edf5;
  font-family:
    Tahoma,
    Arial,
    sans-serif;
}

body{
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(1500px,100%);
  margin:auto;
  padding:12px;
}

.header{
  border:1px solid #202735;
  background:#0d1118;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
}

.header h1{
  margin:0 0 6px;
  font-size:22px;
}

.header p{
  margin:0;
  color:#8792a5;
  font-size:13px;
}

.status{
  margin-top:12px;
  border-radius:10px;
  padding:10px 12px;
  background:#111722;
  border:1px solid #242c3a;
  font-size:13px;
}

.status.ok{
  border-color:#174d34;
  color:#5ee49b;
}

.status.error{
  border-color:#5c2028;
  color:#ff7180;
}

.controls{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:10px;
  margin-bottom:12px;
}

.control{
  background:#0d1118;
  border:1px solid #202735;
  border-radius:12px;
  padding:10px;
}

.control label{
  display:block;
  color:#8994a7;
  font-size:12px;
  margin-bottom:7px;
}

input,
select{
  width:100%;
  border:1px solid #293242;
  background:#111722;
  color:#fff;
  border-radius:9px;
  padding:10px;
  outline:none;
}

input:focus,
select:focus{
  border-color:#4c78a8;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:12px;
}

.btn{
  border:1px solid #293242;
  background:#111722;
  color:#e8edf5;
  padding:10px 15px;
  border-radius:10px;
}

.btn:hover{
  background:#17202d;
}

.btn.primary{
  background:#163c2a;
  border-color:#236443;
  color:#70eca6;
}

.btn.danger{
  background:#421b22;
  border-color:#6d2b35;
  color:#ff7d8a;
}

.chart-card{
  border:1px solid #202735;
  background:#0d1118;
  border-radius:16px;
  overflow:hidden;
  margin-bottom:12px;
}

.chart-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px;
  border-bottom:1px solid #202735;
}

.chart-title{
  font-weight:bold;
}

.chart-info{
  color:#8e99ab;
  font-size:12px;
}

#chart{
  width:100%;
  height:440px;
  display:block;
  background:#090c11;
  touch-action:none;
}

.tabs{
  display:flex;
  gap:5px;
  padding:8px;
  overflow-x:auto;
  border-bottom:1px solid #202735;
  background:#0b0f15;
}

.tab{
  flex:0 0 auto;
  border:1px solid #293242;
  background:#111722;
  color:#9ba5b5;
  border-radius:9px;
  padding:9px 12px;
}

.tab.active{
  background:#1a2532;
  color:#fff;
  border-color:#46566e;
}

.panel{
  padding:12px;
  min-height:260px;
}

.metrics{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:8px;
  margin-bottom:12px;
}

.metric{
  background:#111722;
  border:1px solid #242c3a;
  border-radius:10px;
  padding:10px;
}

.metric .label{
  color:#8994a7;
  font-size:11px;
  margin-bottom:5px;
}

.metric .value{
  font-size:15px;
  font-weight:bold;
  direction:ltr;
  text-align:right;
}

.green{
  color:#58e99a !important;
}

.red{
  color:#ff6978 !important;
}

.yellow{
  color:#f1c75b !important;
}

.blue{
  color:#65a9ff !important;
}

.muted{
  color:#8b95a7;
}

.table-wrap{
  overflow:auto;
  border:1px solid #202735;
  border-radius:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th,
td{
  padding:8px;
  border-bottom:1px solid #202735;
  text-align:center;
  font-size:12px;
  white-space:nowrap;
}

th{
  color:#aab4c5;
  background:#111722;
  position:sticky;
  top:0;
}

tr:last-child td{
  border-bottom:0;
}

.signal{
  border:1px solid #293242;
  background:#111722;
  border-radius:12px;
  padding:12px;
  margin-bottom:8px;
}

.signal.buy{
  border-color:#235f42;
}

.signal.sell{
  border-color:#6b2934;
}

.signal-title{
  font-weight:bold;
  margin-bottom:6px;
}

.empty{
  padding:35px 10px;
  text-align:center;
  color:#737e90;
}

.footer{
  text-align:center;
  color:#5f6a7b;
  padding:15px;
  font-size:11px;
}

@media(max-width:900px){
  .controls{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .metrics{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  #chart{
    height:380px;

}

@media(max-width:550px){
  .app{
    padding:7px;
  }

  .controls{
    grid-template-columns:1fr 1fr;
  }

  .header h1{
    font-size:18px;
  }

  #chart{
    height:330px;
  }

  .metrics{
    grid-template-columns:1fr 1fr;
  }
}

<body>

<div class="app">

<script>
"use strict";

const FRONT_VERSION =
  "ABSORPTION-ZONE-SCANNER-V5";

const DEFAULT_SYMBOL =
  "BTCUSDT";

let marketData = null;
let activePanel = "footprint";
let liveTimer = null;
let loading = false;

const canvas =
  document.getElementById("chart");

const ctx =
  canvas.getContext("2d");

const statusEl =
  document.getElementById("status");

const symbolEl =
  document.getElementById("symbol");

const categoryEl =
  document.getElementById("category");

const intervalEl =
  document.getElementById("interval");

const chartInfo =
  document.getElementById("chartInfo");

const panelEl =
  document.getElementById("panel");

function safeSymbol(value) {
  let s = String(value || "")
    .trim()
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "");

  if (
    !s ||
    s === "BUSDT" ||
    s === "USDT"
  ) {
    return DEFAULT_SYMBOL;
  }

  if (!s.endsWith("USDT")) {
    s += "USDT";
  }

  return s;
}

function setStatus(
  text,
  type = ""
) {
  statusEl.textContent = text;
  statusEl.className =
    "status " + type;
}

function fmt(
  value,
  digits = 2
) {
  const n = Number(value);

  if (!Number.isFinite(n)) {
    return "0";
  }

  if (
    Math.abs(n) >= 1000000000
  ) {
    return (
      (n / 1000000000)
        .toFixed(2) + "B"
    );
  }

  if (
    Math.abs(n) >= 1000000
  ) {
    return (
      (n / 1000000)
        .toFixed(2) + "M"
    );
  }

  if (
    Math.abs(n) >= 1000
  ) {
    return (
      (n / 1000)
        .toFixed(2) + "K"
    );
  }

  return n.toLocaleString(
    "en-US",
    {
      maximumFractionDigits:
        digits
    }
  );
}

function priceFmt(value) {
  const n = Number(value);

  if (!Number.isFinite(n)) {
    return "0";
  }

  if (n >= 1000) {
    return n.toFixed(2);
  }

  if (n >= 1) {
    return n.toFixed(4);
  }

  if (n >= 0.01) {
    return n.toFixed(6);
  }

  return n.toPrecision(6);
}

function timeFmt(ms) {
  if (!ms) return "--";

  const d =
    new Date(Number(ms));

  return d.toLocaleTimeString(
    "fa-IR",
    {
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    }
  );
}

async function api(path, params = {}) {
  const url =
    new URL(
      path,
      window.location.origin
    );

  for (
    const [key, value]
    of Object.entries(params)
  ) {
    if (
      value !== undefined &&
      value !== null
    ) {
      url.searchParams.set(
        key,
        String(value)
      );
    }
  }

  // جلوگیری قطعی از Cache
  url.searchParams.set(
    "_",
    Date.now().toString()
  );

  let response;

  try {
    response =
      await fetch(
        url.toString(),
        {
          method:"GET",
          cache:"no-store",
          headers:{
            "accept":
              "application/json",
            "cache-control":
              "no-cache"
          }
        }
      );
  } catch (error) {
    throw new Error(
      "اتصال به Worker برقرار نشد"
    );
  }

  const text =
    await response.text();

  if (!text || !text.trim()) {
    throw new Error(
      `Worker پاسخ خالی داد (${response.status})`
    );
  }

  let data;

  try {
    data =
      JSON.parse(text);
  } catch (error) {
    throw new Error(
      `پاسخ Worker JSON معتبر نیست (${response.status})`
    );
  }

  if (
    !response.ok ||
    data?.ok === false
  ) {
    throw new Error(
      data?.error ||
      data?.retMsg ||
      `خطای Worker ${response.status}`
    );
  }

  return data;
}

async function health() {
  try {
    const data =
      await api(
        "/api/health"
      );

    setStatus(
      `🟢 اتصال برقرار است — Bybit · ${data.version}`,
      "ok"
    );

    document.getElementById(
      "version"
    ).textContent =
      data.version;

    return true;

  } catch (error) {
    setStatus(
      "🔴 " + error.message,
      "error"
    );

    return false;
  }
}

function resizeCanvas() {
  const rect =
    canvas.getBoundingClientRect();

  const ratio =
    window.devicePixelRatio || 1;

  canvas.width =
    Math.max(
      1,
      Math.floor(
        rect.width * ratio
      )
    );

  canvas.height =
    Math.max(
      1,
      Math.floor(
        rect.height * ratio
      )
    );

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  drawChart();
}

function clearChart() {
  const w =
    canvas.clientWidth;

  const h =
    canvas.clientHeight;

  ctx.clearRect(
    0,
    0,
    w,
    h
  );

  ctx.fillStyle =
    "#090c11";

  ctx.fillRect(
    0,
    0,
    w,
    h
  );
}

let view = {
  offset:0,
  zoom:1,
  selected:-1,
  dragging:false,
  startX:0,
  startOffset:0
};

function drawGrid(
  w,
  h,
  left,
  top,
  right,
  bottom
) {
  ctx.strokeStyle =
    "#18202b";

  ctx.lineWidth = 1;

  for (
    let i = 0;
    i <= 5;
    i++
  ) {
    const y =
      top +
      (bottom - top) *
      i / 5;

    ctx.beginPath();
    ctx.moveTo(left,y);
    ctx.lineTo(right,y);
    ctx.stroke();
  }

  for (
    let i = 0;
    i <= 8;
    i++
  ) {
    const x =
      left +
      (right - left) *
      i / 8;

    ctx.beginPath();
    ctx.moveTo(x,top);
    ctx.lineTo(x,bottom);
    ctx.stroke();
  }
}

function drawChart() {
  clearChart();

  const candles =
    marketData?.candles || [];

  if (!candles.length) {
    ctx.fillStyle =
      "#737e90";

    ctx.font =
      "14px Tahoma";

    ctx.textAlign =
      "center";

    ctx.fillText(
      "داده کندل دریافت نشد",
      canvas.clientWidth / 2,
      canvas.clientHeight / 2
    );

    return;
  }

  const w =
    canvas.clientWidth;

  const h =
    canvas.clientHeight;

  const left = 55;
  const right = w - 70;
  const top = 25;
  const bottom = h - 38;

  drawGrid(
    w,
    h,
    left,
    top,
    right,
    bottom
  );

  const count =
    Math.max(
      25,
      Math.floor(
        90 * view.zoom
      )
    );

  const end =
    candles.length -
    Math.round(view.offset);

  const start =
    Math.max(
      0,
      end - count
    );

  const visible =
    candles.slice(
      start,
      end
    );

  if (!visible.length) {
    return;
  }

  let min =
    Math.min(
      ...visible.map(
        c => c.low
      )
    );

  let max =
    Math.max(
      ...visible.map(
        c => c.high
      )
    );

  const padding =
    (max - min) * 0.08 ||
    max * 0.001;

  min -= padding;
  max += padding;

  const range =
    max - min || 1;

  const yOf =
    price =>
      bottom -
      (
        (price - min) /
        range
      ) *
      (bottom - top);

  const candleWidth =
    Math.max(
      3,
      (right - left) /
      visible.length * 0.68
    );

  for (
    let i = 0;
    i < visible.length;
    i++
  ) {
    const c =
      visible[i];

    const x =
      left +
      (
        i + 0.5
      ) *
      (
        (right-left) /
        visible.length
      );

    const openY =
      yOf(c.open);

    const closeY =
      yOf(c.close);

    const highY =
      yOf(c.high);

    const lowY =
      yOf(c.low);

    const up =
      c.close >= c.open;

    ctx.strokeStyle =
      up
        ? "#3ee58a"
        : "#ff5e70";

    ctx.fillStyle =
      up
        ? "#3ee58a"
        : "#ff5e70";

    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.moveTo(x,highY);
    ctx.lineTo(x,lowY);
    ctx.stroke();

    const bodyTop =
      Math.min(
        openY,
        closeY
      );

    const bodyHeight =
      Math.max(
        1,
        Math.abs(
          closeY-openY
        )
      );

    ctx.fillRect(
      x-candleWidth/2,
      bodyTop,
      candleWidth,
      bodyHeight
    );

    const globalIndex =
      start + i;

    if (
      globalIndex ===
      view.selected
    ) {
      ctx.strokeStyle =
        "#f5d76e";

      ctx.lineWidth = 2;

      ctx.strokeRect(
        x-candleWidth/2-3,
        bodyTop-3,
        candleWidth+6,
        bodyHeight+6
      );
    }
  }

  ctx.font =
    "11px Tahoma";

  ctx.textAlign =
    "left";

  ctx.fillStyle =
    "#8e99ab";

  for (
    let i=0;
    i<=5;
    i++
  ) {
    const price =
      max -
      range * i/5;

    const y =
      yOf(price);

    ctx.fillText(
      priceFmt(price),
      right + 6,
      y + 4
    );
  }

  ctx.textAlign =
    "center";

  const step =
    Math.max(
      1,
      Math.floor(
        visible.length/6
      )
    );

  for (
    let i=0;
    i<visible.length;
    i+=step
  ) {
    const x =
      left +
      (
        i + .5
      ) *
      (
        (right-left) /
        visible.length
      );

    ctx.fillStyle =
      "#707b8d";

    ctx.fillText(
      timeFmt(
        visible[i].time
      ),
      x,
      h-13
    );
  }

  drawLiquidityOverlay(
    left,
    right,
    top,
    bottom,
    min,
    max
  );
}

function drawLiquidityOverlay(
  left,
  right,
  top,
  bottom,
  min,
  max
) {
  const book =
    marketData?.orderbook;

  if (!book) return;

  const range =
    max-min || 1;

  const yOf =
    price =>
      bottom -
      (
        (price-min)/range
      ) *
      (bottom-top);

  const walls = [
    ...(book.buyWalls || [])
      .slice(0,5)
      .map(x => ({
        ...x,
        side:"buy"
      })),

    ...(book.sellWalls || [])
      .slice(0,5)
      .map(x => ({
        ...x,
        side:"sell"
      }))
  ];

  for (
    const wall of walls
  ) {
    if (
      wall.price < min ||
      wall.price > max
    ) continue;

    const y =
      yOf(wall.price);

    ctx.globalAlpha =
      0.18;

    ctx.fillStyle =
      wall.side === "buy"
        ? "#25d982"
        : "#ff5367";

    ctx.fillRect(
      left,
      y-3,
      right-left,
      6
    );

    ctx.globalAlpha =
      1;

    ctx.fillStyle =
      wall.side === "buy"
        ? "#42e89a"
        : "#ff6d7c";

    ctx.font =
      "10px Tahoma";

    ctx.textAlign =
      "left";

    ctx.fillText(
      `${wall.side === "buy" ? "BUY" : "SELL"} ${priceFmt(wall.price)}`,
      left+5,
      y-5
    );
  }
}

function selectedCandle() {
  const candles =
    marketData?.candles || [];

  if (
    view.selected >= 0 &&
    view.selected <
      candles.length
  ) {
    return candles[
      view.selected
    ];
  }

  return candles[
    candles.length-1
  ] || null;
}

function renderMetrics(items) {
  return `
    <div class="metrics">
      ${items.map(x => `
        <div class="metric">
          <div class="label">${x.label}</div>
          <div class="value ${x.className || ""}">
            ${x.value}
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderFootprint() {
  const fp =
    marketData?.footprint;

  const ts =
    marketData?.tradeStats;

  if (!fp) {
    return `
      <div class="empty">
        Footprint موجود نیست

async function loadMarket() {
  if (loading) return;

  loading = true;

  const symbol =
    safeSymbol(
      symbolEl.value
    );

  symbolEl.value =
    symbol;

  const category =
    categoryEl.value === "spot"
      ? "spot"
      : "linear";

  const interval =
    intervalEl.value;

  try {
    setStatus(
      "🟡 دریافت داده واقعی Bybit..."
    );

    const data =
      await api(
        "/api/market",
        {
          category,
          symbol,
          interval
        }
      );

    marketData =
      data;

    setStatus(
      `🟢 ${symbol} · ${
        category === "linear"
          ? "Futures"
          : "Spot"
      } · ${interval}m · Live`,
      "ok"
    );

    view.selected = -1;

    drawChart();
    renderPanel();

    const candle =
      selectedCandle();

    chartInfo.textContent =
      candle
        ? `${symbol} · ${priceFmt(candle.close)}`
        : "کندل را لمس کنید";

  } catch (error) {
    setStatus(
      "🔴 " +
      (
        error?.message ||
        "خطا در دریافت اطلاعات بازار"
      ),
      "error"
    );

    panelEl.innerHTML = `
      <div class="empty">
        خطا در دریافت اطلاعات بازار
        <br><br>
        <span class="red">
          ${
            error?.message ||
            "Unknown error"
          }
        </span>
      </div>
    `;

  } finally {
    loading = false;
  }
}

function stopLive() {
  if (liveTimer) {
    clearInterval(

    liveTimer = null;
  }

  document.getElementById(
    "live"
  ).textContent =
    "🟢 Live";
}

function candleIndexFromX(
  x
) {
  const candles =
    marketData?.candles || [];

  if (!candles.length) {
    return -1;
  }

  const w =
    canvas.clientWidth;

  const left = 55;
  const right =
    w - 70;

  const count =
    Math.max(
      25,
      Math.floor(
        90 * view.zoom
      )
    );

  const end =
    candles.length -
    Math.round(
      view.offset
    );

  const start =
    Math.max(
      0,
      end-count
    );

  const visibleCount =
    Math.max(
      1,
      Math.min(
        count,
        candles.length-start
      )
    );

  const relative =
    (
      x-left
    ) /
    (
      right-left
    ) *
    visibleCount;

  const index =
    start +
    Math.floor(relative);

  return Math.max(
    start,
    Math.min(
      end-1,
      index
    )
  );
}

function handlePointerDown(e) {
  view.dragging = true;
  view.startX =
    e.clientX;
  view.startOffset =
    view.offset;

  try {
    canvas.setPointerCapture(
      e.pointerId
    );
  } catch {}
}

function handlePointerMove(e) {
  if (!view.dragging) return;

  const dx =
    e.clientX -
    view.startX;

  const width =
    canvas.clientWidth;

  const candles =
    marketData?.candles || [];

  const count =
    Math.max(
      25,
      Math.floor(
        90 * view.zoom
      )
    );

  const shift =
    dx /
    Math.max(
      1,
      width
    ) *
    count;

  view.offset =
    Math.max(
      0,
      Math.min(
        Math.max(
          0,
          candles.length -
          count
        ),
        view.startOffset -
        shift
      )
    );

  drawChart();
}

function handlePointerUp(e) {
  if (!view.dragging) return;

  const dx =
    Math.abs(
      e.clientX -
      view.startX
    );

  view.dragging = false;

  try {
    canvas.releasePointerCapture(
      e.pointerId
    );
  } catch {}

  if (dx < 8) {
    const rect =
      canvas.getBoundingClientRect();

    const x =
      e.clientX -
      rect.left;

    const index =
      candleIndexFromX(x);

    if (index >= 0) {
      view.selected =
        index;

      const candle =
        marketData.candles[
          index
        ];

      chartInfo.textContent =
        `${timeFmt(candle.time)} · O ${priceFmt(candle.open)} · H ${priceFmt(candle.high)} · L ${priceFmt(candle.low)} · C ${priceFmt(candle.close)}`;

      drawChart();
    }
  }
}

function handleWheel(e) {
  e.preventDefault();

  const oldZoom =
    view.zoom;

  if (e.deltaY < 0) {
    view.zoom =
      Math.max(
        0.35,
        view.zoom * 0.9
      );
  } else {
    view.zoom =
      Math.min(
        4,
        view.zoom * 1.1
      );
  }

  if (
    oldZoom !==
    view.zoom
  ) {
    drawChart();
  }
}
