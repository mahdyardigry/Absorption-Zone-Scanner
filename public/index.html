<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Absorption Zone Scanner</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#070b10;
  color:#e9eef5;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  min-height:100vh;
}

.app{
  width:100%;
  max-width:1500px;
  margin:auto;
  padding:10px;
}

.card{
  background:#0d141c;
  border:1px solid #202c38;
  border-radius:14px;
  padding:10px;
  margin-bottom:10px;
}

.header{
  text-align:center;
  padding:8px 4px 12px;
}

.header h1{
  margin:4px 0;
  font-size:22px;
}

.header p{
  margin:4px 0;
  color:#8795a5;
  font-size:12px;
}

.controls{
  display:grid;
  grid-template-columns:
    minmax(100px,1fr)
    minmax(100px,1fr)
    minmax(80px,1fr)
    auto;
  gap:7px;
}

input,select,button{
  width:100%;
  min-height:42px;
  border-radius:9px;
  border:1px solid #2a3744;
  background:#111b25;
  color:#fff;
  padding:8px 10px;
  font-size:14px;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.primary{
  background:#126b4e;
  border-color:#188764;
}

.danger{
  background:#652b35;
  border-color:#843b48;
}

.status{
  margin-top:8px;
  padding:9px;
  border-radius:9px;
  background:#0a1118;
  color:#aeb9c5;
  text-align:center;
  font-size:12px;
}

.chartWrap{
  position:relative;
  width:100%;
  height:520px;
  overflow:hidden;
  border-radius:10px;
  background:#080e14;
}

#chart{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

.chartInfo{
  position:absolute;
  left:8px;
  top:8px;
  z-index:2;
  background:rgba(4,8,12,.8);
  border:1px solid #263442;
  border-radius:8px;
  padding:6px 8px;
  font-size:11px;
  direction:ltr;
}

.nav{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  overflow-x:auto;
}

.nav button{
  min-width:80px;
  font-size:12px;
  padding:6px;
}

.nav button.active{
  border-color:#22c994;
  background:#10291f;
}

.panelTitle{
  font-size:15px;
  font-weight:bold;
  margin-bottom:8px;
}

.stats{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:7px;
}

.stat{
  background:#0a1118;
  border:1px solid #202c38;
  border-radius:9px;
  padding:9px;
  text-align:center;
  font-size:11px;
  color:#8795a5;
}

.stat b{
  display:block;
  margin-top:5px;
  color:#fff;
  font-size:13px;
}

.green{
  color:#27d996!important;
}

.red{
  color:#ff5b68!important;
}

.yellow{
  color:#ffd166!important;
}

.blue{
  color:#58a6ff!important;
}

.flowGrid{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:6px;
}

.flowBox{
  background:#091018;
  border:1px solid #1e2a36;
  border-radius:8px;
  padding:8px;
  font-size:11px;
}

.flowBox b{
  display:block;
  margin-top:4px;
  font-size:13px;
}

.footprint{
  overflow:auto;
  max-height:600px;
}

.fpHead{
  display:grid;
  grid-template-columns:
    1fr 1fr 80px 1fr 1fr;
  min-width:520px;
  position:sticky;
  top:0;
  background:#0d141c;
  z-index:3;
}

.fpHead div{
  padding:7px;
  text-align:center;
  border-bottom:1px solid #293642;
  font-size:11px;
}

.fpRow{
  display:grid;
  grid-template-columns:
    1fr 1fr 80px 1fr 1fr;
  min-width:520px;
  align-items:center;
}

.fpRow div{
  padding:5px;
  text-align:center;
  border-bottom:1px solid #17222d;
  font-size:11px;
}

.fpBid{
  color:#ff6672;
}

.fpAsk{
  color:#27d996;
}

.fpPrice{
  color:#dfe8f2;
  font-weight:bold;
}

.fpDeltaPos{
  color:#27d996;
}

.fpDeltaNeg{
  color:#ff6672;
}

.bar{
  height:7px;
  border-radius:5px;
  background:#17212b;
  overflow:hidden;
}

.bar i{
  display:block;
  height:100%;
  background:#22c994;
}

.book{
  overflow:auto;
}

.bookRow{
  display:grid;
  grid-template-columns:
    1fr 1fr 1fr;
  min-width:360px;
  gap:4px;
  padding:5px;
  border-bottom:1px solid #17212b;
  font-size:11px;
  text-align:center;
}

.section{
  margin-top:10px;
}

.muted{
  color:#758392;
}

.error{
  background:#32151a;
  border:1px solid #74303a;
  color:#ff7b86;
  padding:10px;
  border-radius:9px;
}

.success{
  background:#0e2b20;
  border:1px solid #1e7256;
  color:#42dda5;
  padding:10px;
  border-radius:9px;
}

@media(max-width:800px){
  .controls{
    grid-template-columns:
      1fr 1fr;
  }

  .chartWrap{
    height:430px;
  }

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

  .flowGrid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .nav{
    display:flex;
  }

  .nav button{
    flex:0 0 86px;
  }
}

@media(max-width:500px){
  .app{
    padding:6px;
  }

  .chartWrap{
    height:390px;
  }

  .header h1{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>📊 Absorption Zone Scanner</h1>
    <p>تحلیل Order Flow واقعی Bybit</p>
  </div>

  <div class="card">

    <div class="controls">

      <select id="category">
        <option value="linear">Futures</option>
        <option value="spot">Spot</option>
      </select>

      <input
        id="symbol"
        value="BTCUSDT"
        placeholder="BTCUSDT">

      <select id="interval">
        <option value="1">1m</option>
        <option value="3">3m</option>
        <option value="5">5m</option>
        <option value="15">15m</option>
        <option value="30">30m</option>
        <option value="60">1H</option>
      </select>

      <button
        id="refresh"
        class="primary">
        ↻ بروزرسانی
      </button>

    </div>

    <div
      id="status"
      class="status">
      🟡 آماده
    </div>

  </div>

  <div class="card">

    <div class="chartWrap">

      <canvas id="chart"></canvas>

      <div
        id="chartInfo"
        class="chartInfo">
        کندل را لمس کنید
      </div>

    </div>

  </div>

  <div class="card">

    <div
      id="nav"
      class="nav">

      <button
        data-panel="footprint"
        class="active">
        🧱 Footprint
      </button>

      <button data-panel="heatmap">
        🔥 Heatmap
      </button>

      <button data-panel="liquidity">
        💧 Liquidity
      </button>

      <button data-panel="absorption">
        🧲 Absorption
      </button>

      <button data-panel="book">
        📖 Order Book
      </button>

      <button data-panel="delta">
        Δ Delta / CVD
      </button>

      <button data-panel="large">
        🐋 Large Trades
      </button>

    </div>

  </div>

  <div id="panel"></div>

</div>

<script>
"use strict";

/* =========================================================
   GLOBAL
========================================================= */

const $ = id =>
  document.getElementById(id);

const state = {
  category: "linear",
  symbol: "BTCUSDT",
  interval: "1",

  candles: [],
  trades: [],
  market: null,
  footprint: null,

  selected: -1,
  panel: "footprint",

  timer: null,

  zoom: 1,
  offset: 0,

  dragging: false,
  lastX: 0
};

/* =========================================================
   SAFE JSON
========================================================= */

async function api(path) {
  const response =
    await fetch(
      path,
      {
        cache: "no-store",
        headers: {
          Accept:
            "application/json"
        }
      }
    );

  const text =
    await response.text();

  if (!text.trim()) {
    throw new Error(
      `Worker پاسخ خالی داد (${response.status})`
    );
  }

  let data;

  try {
    data =
      JSON.parse(text);
  } catch {
    throw new Error(
      `Worker پاسخ JSON معتبر نداد (${response.status})`
    );
  }

  if (!response.ok) {
    throw new Error(
      data.error ||
      `HTTP ${response.status}`
    );
  }

  if (!data.ok) {
    throw new Error(
      data.error ||
      "خطای Worker"
    );
  }

  return data;
}

/* =========================================================
   STATUS
========================================================= */

function status(text) {
  $("status").textContent =
    text;
}

/* =========================================================
   FORMAT
========================================================= */

function fmt(v, digits = 2) {
  const n = Number(v);

  if (!Number.isFinite(n)) {
    return "—";
  }

  return n.toLocaleString(
    "en-US",
    {
      maximumFractionDigits:
        digits
    }
  );
}

function pct(v) {
  const n = Number(v);

  if (!Number.isFinite(n)) {
    return "—";
  }

  return n.toFixed(2) + "%";
}

/* =========================================================
   LOAD
========================================================= */

async function load() {
  stopLive();

  state.category =
    $("category").value;

  state.symbol =
    $("symbol").value
      .trim()
      .toUpperCase();

  state.interval =
    $("interval").value;

  if (!state.symbol) {
    status("🔴 نماد وارد نشده است");
    return;
  }

  try {
    status(
      "🟡 دریافت داده واقعی Bybit..."
    );

    const data =
      await api(
        `/api/market?category=${encodeURIComponent(state.category)}&symbol=${encodeURIComponent(state.symbol)}&interval=${encodeURIComponent(state.interval)}`
      );

    state.market = data;
    state.candles =
      data.candles || [];

    state.trades =
      data.trades || [];

    state.selected =
      state.candles.length - 1;

    state.zoom = 1;
    state.offset = 0;

    drawChart();
    renderPanel();

    await loadSelectedFootprint();

    status(
      `🟢 متصل به Bybit · ${state.symbol}`
    );

    startLive();

  } catch (e) {

    console.error(e);

    $("panel").innerHTML =
      `<div class="card error">
        ${escapeHtml(
          e.message ||
          "خطا در دریافت اطلاعات بازار"
        )}
      </div>`;

    status(
      "🔴 " +
      (
        e.message ||
        "خطا در دریافت اطلاعات بازار"
      )
    );
  }
}

/* =========================================================
   LIVE
========================================================= */

function startLive() {
  stopLive();

  state.timer =
    setInterval(
      async () => {

        try {

          const data =
            await api(
              `/api/market?category=${encodeURIComponent(state.category)}&symbol=${encodeURIComponent(state.symbol)}&interval=${encodeURIComponent(state.interval)}`
            );

          state.market =
            data;

          state.candles =
            data.candles || [];

          drawChart();

          if (
            state.selected >=
            state.candles.length
          ) {
            state.selected =
              state.candles.length - 1;
          }

          await loadSelectedFootprint();

          status(
            `🟢 زنده · ${new Date().toLocaleTimeString("fa-IR")}`
          );

        } catch (e) {

          status(
            "🟠 " +
            (
              e.message ||
              "خطا در بروزرسانی"
            )
          );

        }

      },
      5000
    );
}

function stopLive() {
  if (state.timer) {
    clearInterval(
      state.timer
    );

    state.timer = null;
  }
}

/* =========================================================
   FOOTPRINT
========================================================= */

async function loadSelectedFootprint() {

  if (
    state.selected < 0 ||
    !state.candles[state.selected]
  ) {
    return;
  }

  const candle =
    state.candles[
      state.selected
    ];

  try {

    const data =
      await api(
        `/api/footprint?category=${encodeURIComponent(state.category)}&symbol=${encodeURIComponent(state.symbol)}&interval=${encodeURIComponent(state.interval)}&time=${encodeURIComponent(candle.time)}`
      );

    state.footprint =
      data.footprint;

    if (
      state.panel ===
      "footprint"
    ) {
      renderPanel();
    }

  } catch (e) {

    state.footprint = {
      rows: [],
      error:
        e.message
    };

    renderPanel();
  }
}

/* =========================================================
   CHART
========================================================= */

function drawChart() {

  const canvas =
    $("chart");

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio ||
    1;

  canvas.width =
    rect.width * dpr;

  canvas.height =
    rect.height * dpr;

  const ctx =
    canvas.getContext("2d");

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  const W = rect.width;
  const H = rect.height;

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  if (
    !state.candles.length
  ) {
    ctx.fillStyle =
      "#6f7d8b";

    ctx.font =
      "13px Tahoma";

    ctx.textAlign =
      "center";

    ctx.fillText(
      "داده‌ای وجود ندارد",
      W / 2,
      H / 2
    );

    return;
  }

  const left = 8;
  const right = 72;
  const top = 25;
  const bottom = 30;

  const chartW =
    W - left - right;

  const chartH =
    H - top - bottom;

  const visible =
    Math.max(
      20,
      Math.min(
        state.candles.length,
        Math.floor(
          80 / state.zoom
        )
      )
    );

  const maxOffset =
    Math.max(
      0,
      state.candles.length -
      visible
    );

  state.offset =
    Math.max(
      0,
      Math.min(
        state.offset,
        maxOffset
      )
    );

  const start =
    state.offset;

  const end =
    Math.min(
      state.candles.length,
      start + visible
    );

  const arr =
    state.candles.slice(
      start,
      end
    );

  let hi =
    Math.max(
      ...arr.map(
        x => x.high
      )
    );

  let lo =
    Math.min(
      ...arr.map(
        x => x.low
      )
    );

  if (hi === lo) {
    hi += 1;
    lo -= 1;
  }

  const pad =
    (hi - lo) * .06;

  hi += pad;
  lo -= pad;

  function py(price) {
    return (
      top +
      (
        hi - price
      ) /
      (
        hi - lo
      ) *
      chartH
    );
  }

  ctx.strokeStyle =
    "#18232d";

  ctx.lineWidth = 1;

  for (
    let i = 0;
    i <= 5;
    i++
  ) {

    const y =
      top +
      chartH *
      i / 5;

    ctx.beginPath();
    ctx.moveTo(
      left,
      y
    );

    ctx.lineTo(
      W - right,
      y
    );

    ctx.stroke();

    const price =
      hi -
      (
        hi - lo
      ) *
      i / 5;

    ctx.fillStyle =
      "#718090";

    ctx.font =
      "10px Arial";

    ctx.textAlign =
      "left";

    ctx.fillText(
      fmt(price, 6),
      W - right + 5,
      y + 3
    );
  }

  const gap =
    chartW / arr.length;

  const bodyW =
    Math.max(
      2,
      gap * .58
    );

  arr.forEach(
    (c, i) => {

      const index =
        start + i;

      const x =
        left +
        i * gap +
        gap / 2;

      const yHigh =
        py(c.high);

      const yLow =
        py(c.low);

      const yOpen =
        py(c.open);

      const yClose =
        py(c.close);

      const selected =
        index ===
        state.selected;

      ctx.strokeStyle =
        c.close >= c.open
          ? "#27d996"
          : "#ff5968";

      ctx.lineWidth =
        selected ? 3 : 1;

      ctx.beginPath();

      ctx.moveTo(
        x,
        yHigh
      );

      ctx.lineTo(
        x,
        yLow
      );

      ctx.stroke();

      const bodyTop =
        Math.min(
          yOpen,
          yClose
        );

      const bodyHeight =
        Math.max(
          1,
          Math.abs(
            yClose -
            yOpen
          )
        );

      ctx.fillStyle =
        c.close >= c.open
          ? "#27d996"
          : "#ff5968";

      ctx.fillRect(
        x - bodyW / 2,
        bodyTop,
        bodyW,
        bodyHeight
      );

      if (selected) {

        ctx.strokeStyle =
          "#ffd166";

        ctx.lineWidth = 1;

        ctx.strokeRect(
          x - bodyW / 2 - 3,
          bodyTop - 3,
          bodyW + 6,
          bodyHeight + 6
        );
      }

      if (
        i === 0 ||
        i === arr.length - 1 ||
        i % Math.ceil(
          arr.length / 7
        ) === 0
      ) {

        ctx.fillStyle =
          "#657383";

        ctx.font =
          "9px Arial";

        ctx.textAlign =
          "center";

        ctx.fillText(
          new Date(
            c.time
          ).toLocaleTimeString(
            "en-US",
            {
              hour:
                "2-digit",
              minute:
                "2-digit"
            }
          ),
          x,
          H - 8
        );
      }
    }
  );

  const selectedCandle =
    state.candles[
      state.selected
    ];

  if (selectedCandle) {

    $("chartInfo").textContent =
      `${new Date(
        selectedCandle.time
      ).toLocaleTimeString(
        "fa-IR"
      )} · O ${fmt(
        selectedCandle.open,
        6
      )} · H ${fmt(
        selectedCandle.high,
        6
      )} · L ${fmt(
        selectedCandle.low,
        6
      )} · C ${fmt(
        selectedCandle.close,
        6
      )}`;
  }
}

/* =========================================================
   PANEL
========================================================= */

function renderPanel() {

  const p =
    state.panel;

  if (p === "footprint") {
    renderFootprint();
    return;
  }

  if (p === "heatmap") {
    renderHeatmap();
    return;
  }

  if (p === "liquidity") {
    renderLiquidity();
    return;
  }

  if (p === "absorption") {
    renderAbsorption();
    return;
  }

  if (p === "book") {
    renderBook();
    return;
  }

  if (p === "delta") {
    renderDelta();
    return;
  }

  if (p === "large") {
    renderLargeTrades();
  }
}

/* =========================================================
   FOOTPRINT PANEL
========================================================= */

function renderFootprint() {

  const f =
    state.footprint;

  if (!f) {
    $("panel").innerHTML =
      `<div class="card">
        در حال دریافت Footprint...
      </div>`;
    return;
  }

  const rows =
    f.rows || [];

  let html = `
    <div class="card">

      <div class="panelTitle">
        🧱 Footprint
      </div>

      <div class="stats">

        <div class="stat">
          Buy
          <b class="green">
            ${fmt(f.buyValue,0)}
          </b>
        </div>

        <div class="stat">
          Sell
          <b class="red">
            ${fmt(f.sellValue,0)}
          </b>
        </div>

        <div class="stat">
          Delta
          <b class="${
            f.delta >= 0
              ? "green"
              : "red"
          }">
            ${fmt(f.delta,0)}
          </b>
        </div>

        <div class="stat">
          Delta %
          <b class="${
            f.deltaPercent >= 0
              ? "green"
              : "red"
          }">
            ${pct(f.deltaPercent)}
          </b>
        </div>

      </div>

      <div class="flowGrid section">

        <div class="flowBox">
          Volume
          <b>${fmt(f.volume,2)}</b>
        </div>

        <div class="flowBox">
          Trades
          <b>${fmt(f.tradeCount,0)}</b>
        </div>

        <div class="flowBox">
          POC
          <b>
            ${fmt(
              f.poc?.price,
              8
            )}
          </b>
        </div>

        <div class="flowBox">
          Source
          <b class="green">
            REAL
          </b>
        </div>

      </div>

      <div class="footprint section">

        <div class="fpHead">
          <div>Bid</div>
          <div>Price</div>
          <div>Delta</div>
          <div>Ask</div>
          <div>Volume</div>
        </div>
  `;

  if (!rows.length) {

    html += `
      <div class="error">
        برای این کندل معامله واقعی در داده
        فعلی Bybit موجود نیست.
      </div>
    `;

  } else {

    for (const r of rows) {

      html += `
        <div class="fpRow">

          <div class="fpBid">
            ${fmt(r.bid,4)}
          </div>

          <div class="fpPrice">
            ${fmt(r.price,8)}
          </div>

          <div class="${
            r.delta >= 0
              ? "fpDeltaPos"
              : "fpDeltaNeg"
          }">
            ${fmt(r.delta,4)}
          </div>

          <div class="fpAsk">
            ${fmt(r.ask,4)}
          </div>

          <div>
            ${fmt(r.volume,4)}

            <div class="bar">
              <i style="width:${Math.min(
                100,
                r.volume /

/* =========================================================
   CHART TOUCH / MOUSE
========================================================= */

const canvas =
  $("chart");

canvas.addEventListener(
  "pointerdown",
  e => {

    state.dragging = true;
    state.lastX =
      e.clientX;

    canvas.setPointerCapture(
      e.pointerId
    );
  }
);

canvas.addEventListener(
  "pointermove",
  e => {

    if (!state.dragging) {
      return;
    }

    const dx =
      e.clientX -
      state.lastX;

    state.lastX =
      e.clientX;

    const rect =
      canvas.getBoundingClientRect();

    const visible =
      Math.max(
        20,
        Math.min(
          state.candles.length,
          Math.floor(
            80 / state.zoom
          )
        )
      );

    const pxPerCandle =
      rect.width /
      visible;

    const move =
      Math.round(
        -dx /
        pxPerCandle
      );

    state.offset =
      Math.max(
        0,
        Math.min(
          state.candles.length -
          visible,
          state.offset +
          move
        )
      );

    drawChart();
  }
);

canvas.addEventListener(
  "pointerup",
  e => {

    state.dragging =
      false;

    try {
      canvas.releasePointerCapture(
        e.pointerId
      );
    } catch {}
  }
);

canvas.addEventListener(
  "pointercancel",
  () => {
    state.dragging =
      false;
  }
);

canvas.addEventListener(
  "wheel",
  e => {

    e.preventDefault();

    const old =
      state.zoom;

    state.zoom =
      e.deltaY < 0
        ? Math.min(
            8,
            state.zoom * 1.15
          )
        : Math.max(
            1,
            state.zoom / 1.15
          );

    if (
      old !== state.zoom
    ) {
      drawChart();
    }
  },
  {
    passive:false
  }
);

/* =========================================================
   CANDLE SELECTION
========================================================= */

canvas.addEventListener(
  "click",
  async e => {

    if (
      !state.candles.length
    ) {
      return;
    }

    const rect =
      canvas.getBoundingClientRect();

    const x =
      e.clientX -
      rect.left;

    const left = 8;
    const right = 72;

    const chartW =
      rect.width -
      left -
      right;

    const visible =
      Math.max(
        20,
        Math.min(
          state.candles.length,
          Math.floor(
            80 / state.zoom
          )
        )
      );

    const gap =
      chartW /
      visible;

    const local =
      Math.floor(
        (x - left) /
        gap
      );

    if (
      local < 0 ||
      local >= visible
    ) {
      return;
    }

    const index =
      state.offset +
      local;

    if (
      !state.candles[index]
    ) {
      return;
    }

    state.selected =
      index;

    drawChart();

    if (
      state.panel ===
      "footprint"
    ) {
      await loadSelectedFootprint();
    } else {
      renderPanel();
    }
  }
);

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}
