<script>
"use strict";

const VERSION =
"ABSORPTION-ZONE-SCANNER-V4-FIX";

const state = {
data:null,
selected:-1,
zoom:1,
offset:0,
drag:false,
startX:0,
startOffset:0
};

const $ =
id =>
document.getElementById(id);

const canvas =
$("chart");

const ctx =
canvas.getContext("2d");

function symbolNormalize(value){

let s =
String(value || "")
.trim()
.toUpperCase()
.replace(/[^A-Z0-9]/g,"");

if(
!s ||
s === "USDT" ||
s === "BUSDT"
){
return "BTCUSDT";
}

if(s === "BTC"){
return "BTCUSDT";
}

if(!s.endsWith("USDT")){
s += "USDT";
}

return s;
}

function getSymbol(){

const s =
symbolNormalize(
$("symbol").value
);

$("symbol").value = s;

return s;
}

function getCategory(){

return $("category").value ===
"spot"
? "spot"
: "linear";
}

function getInterval(){

return $("interval").value;
}

async function api(path,params={}){

const url =
new URL(
path,
window.location.origin
);

for(
const [key,value]
of Object.entries(params)
){

url.searchParams.set(
key,
String(value)
);
}

url.searchParams.set(
"v",
VERSION
);

url.searchParams.set(
"t",
Date.now()
);

let response;

try{

response =
await fetch(
url.toString(),
{
method:"GET",
cache:"no-store",
headers:{
"Accept":
"application/json",
"Cache-Control":
"no-cache"
}
}
);

}catch(e){

throw new Error(
"اتصال به Worker برقرار نشد"
);
}

const text =
await response.text();

if(
!text ||
!text.trim()
){

throw new Error(
"Worker پاسخ خالی برگرداند"
);
}

let data;

try{

data =
JSON.parse(text);

}catch(e){

throw new Error(
"نسخه قدیمی صفحه یا Worker در حال اجراست — پاسخ JSON نیست"
);
}

if(!response.ok){

throw new Error(
data?.error ||
"خطای Worker"
);
}

if(data.ok === false){

throw new Error(
data.error ||
"خطای Worker"
);
}

return data;
}

function status(text,type){

const e =
$("status");

e.textContent =
text;

e.style.color =
type === "error"
? "#ff6472"
: type === "ok"
? "#35d49a"
: "#ffc857";
}

async function load(){

const symbol =
getSymbol();

const category =
getCategory();

const interval =
getInterval();

status(
"🟡 دریافت اطلاعات واقعی Bybit..."
);

$("chartHint").style.display =
"block";

$("chartHint").textContent =
"در حال دریافت اطلاعات بازار...";

try{

const health =
await api(
"/api/health"
);

if(
health.version !==
VERSION
){

throw new Error(
"Worker نسخه جدید نیست: " +
(health.version || "unknown")
);
}

const data =
await api(
"/api/market",
{
symbol,
category,
interval
}
);

if(
!data.candles ||
!data.candles.length
){

throw new Error(
"کندلی برای این نماد دریافت نشد"
);
}

state.data =
data;

state.selected =
data.candles.length - 1;

$("chartHint").style.display =
"none";

$("chartTitle").textContent =
`${data.symbol} · ${
data.category === "spot"
? "Spot"
: "Futures"
} · ${tf(interval)}`;

status(
`🟢 اتصال برقرار است — Bybit · ${data.symbol} · ${data.version}`,
"ok"
);

render();

}catch(e){

$("chartHint").style.display =
"block";

$("chartHint").textContent =
"خطا در دریافت اطلاعات بازار";

status(
"🔴 " + e.message,
"error"
);

}
}

function tf(v){

return {
"1":"1m",
"3":"3m",
"5":"5m",
"15":"15m",
"30":"30m",
"60":"1H"
}[v] || v;
}

function resize(){

const r =
canvas.getBoundingClientRect();

const dpr =
Math.min(
2,
window.devicePixelRatio || 1
);

canvas.width =
Math.floor(
r.width*dpr
);

canvas.height =
Math.floor(
r.height*dpr
);

ctx.setTransform(
dpr,
0,
0,
dpr,
0,
0
);

draw();
}

function visible(){

const all =
state.data?.candles || [];

if(!all.length){
return [];
}

const count =
Math.max(
12,
Math.min(
all.length,
Math.floor(
70/state.zoom
)
)
);

const end =
Math.max(
1,
all.length -
state.offset
);

const start =
Math.max(
0,
end-count
);

return all.slice(
start,
end
);
}

function price(v){

if(!Number.isFinite(v)){
return "-";
}

if(v>=1000){
return v.toFixed(2);
}

if(v>=1){
return v.toFixed(4);
}

if(v>=.01){
return v.toFixed(5);
}

return v.toPrecision(6);
}

function num(v){

const n =
Number(v);

if(!Number.isFinite(n)){
return "0";
}

return n.toLocaleString(
"en-US",
{
maximumFractionDigits:4
}
);
}

function date(v){

return new Date(v)
.toLocaleString(
"fa-IR",
{
month:"2-digit",
day:"2-digit",
hour:"2-digit",
minute:"2-digit"
}
);
}

function draw(){

const r =
canvas.getBoundingClientRect();

const w =
r.width;

const h =
r.height;

ctx.clearRect(
0,
0,
w,
h
);

ctx.fillStyle =
"#040b10";

ctx.fillRect(
0,
0,
w,
h
);

const all =
state.data?.candles || [];

const cs =
visible();

if(!cs.length){
return;
}

const max =
Math.max(
...cs.map(x=>x.high)
);

const min =
Math.min(
...cs.map(x=>x.low)
);

const range =
Math.max(
max-min,
0.000000001
);

const left=55;
const right=15;
const top=15;
const bottom=35;

const cw =
w-left-right;

const ch =
h-top-bottom;

function Y(v){

return top+
(max-v)/
range*
ch;
}

for(
let i=0;
i<=5;
i++
){

const y =
top+
ch*i/5;

ctx.strokeStyle =
"#122431";

ctx.beginPath();

ctx.moveTo(
left,
y
);

ctx.lineTo(
w-right,
y
);

ctx.stroke();

ctx.fillStyle =
"#5d7485";

ctx.font =
"10px Tahoma";

ctx.textAlign =
"right";

ctx.fillText(
price(
max-range*i/5
),
left-5,
y+3
);
}

const gap =
cw/cs.length;

cs.forEach(
(c,i)=>{

const x =
left+
i*gap+
gap/2;

const bullish =
c.close>=c.open;

const selected =
all[
state.selected
]?.time === c.time;

if(selected){

ctx.fillStyle =
"rgba(255,200,87,.10)";

ctx.fillRect(
x-gap/2,
top,
gap,
ch
);
}

ctx.strokeStyle =
bullish
? "#35d49a"
: "#ff6472";

ctx.lineWidth=1;

ctx.beginPath();

ctx.moveTo(
x,
Y(c.high)
);

ctx.lineTo(
x,
Y(c.low)
);

ctx.stroke();

const bodyTop =
Math.min(
Y(c.open),
Y(c.close)
);

const bodyHeight =
Math.max(
1,
Math.abs(
Y(c.open)-
Y(c.close)
)
);

ctx.fillStyle =
bullish
? "#35d49a"
: "#ff6472";

ctx.fillRect(
x-gap*.27,
bodyTop,
Math.max(
4,
gap*.54
),
bodyHeight
);

if(selected){

ctx.strokeStyle =
"#ffc857";

ctx.lineWidth=2;

ctx.strokeRect(
x-gap*.30,
bodyTop-2,
Math.max(
6,
gap*.60
),
bodyHeight+4
);
}

}
);

const last =
all[all.length-1];

if(last){

const y =
Y(last.close);

ctx.strokeStyle =
"#ffc857";

ctx.setLineDash(
[5,5]
);

ctx.beginPath();

ctx.moveTo(
left,
y
);

ctx.lineTo(
w-right,
y
);

ctx.stroke();

ctx.setLineDash([]);

ctx.fillStyle =
"#ffc857";

ctx.font =
"11px Tahoma";

ctx.textAlign =
"left";

ctx.fillText(
price(last.close),
w-right-70,
y-5
);
}

const selected =
all[state.selected];

if(selected){

$("chartInfo").textContent =
`${date(selected.time)} · O ${price(selected.open)} · H ${price(selected.high)} · L ${price(selected.low)} · C ${price(selected.close)}`;
}
}

function render(){

renderFootprint();
renderHeatmap();
renderLiquidity();
renderAbsorption();
renderOrderbook();
renderDelta();
renderLarge();
draw();
}

function renderFootprint(){

const d =
state.data;

const candle =
d.footprint?.find(
x =>
x.time ===
d.candles[
state.selected
]?.time
);

if(!candle){

$("footprint").innerHTML =
`<div class="card">
Footprint این کندل داده خام ندارد.
</div>`;

return;
}

$("footprint").innerHTML = `

<div class="grid">

<div class="card">
<div class="cardTitle">
BUY VOLUME
</div>
<div class="cardValue greenText">
${num(candle.buyVolume)}
</div>
</div>

<div class="card">
<div class="cardTitle">
SELL VOLUME
</div>
<div class="cardValue redText">
${num(candle.sellVolume)}
</div>
</div>

<div class="card">
<div class="cardTitle">
DELTA
</div>
<div class="cardValue ${
candle.delta>=0
?"greenText"
:"redText"
}">
${num(candle.delta)}
</div>
</div>

<div class="card">
<div class="cardTitle">
PRESSURE
</div>
<div class="cardValue yellowText">
${pressure(candle.pressure)}
</div>
</div>

</div>

<br>

<table class="table">

<thead>
<tr>
<th>Price</th>
<th>Buy</th>
<th>Sell</th>
<th>Delta</th>
<th>Trades</th>
</tr>
</thead>

<tbody>

${
(candle.levels || [])
.slice(0,100)
.map(x=>`

<tr>

<td>
${price(x.price)}
</td>

<td class="greenText">
${num(x.buyVolume)}
</td>

<td class="redText">
${num(x.sellVolume)}
</td>

<td class="${
x.delta>=0
?"greenText"
:"redText"
}">
${num(x.delta)}
</td>

<td>
${x.trades}
</td>

</tr>

`)
.join("")
}

</tbody>
</table>
`;
}

function renderHeatmap(){

const book =
state.data.orderbook;

const rows = [
...(book.bids || [])
.slice(0,25)
.map(x=>({
...x,
side:"BUY"
})),

...(book.asks || [])
.slice(0,25)
.map(x=>({
...x,
side:"SELL"
}))
];

const max =
Math.max(
1,
...rows.map(x=>x.qty)
);

$("heatmap").innerHTML = `

<div class="card">

<div class="cardTitle">
REAL ORDER BOOK HEATMAP
</div>

${
rows
.sort(
(a,b)=>
b.price-a.price
)
.map(x=>{

const width =
Math.max(
2,
x.qty/max*100
);

return `

<div style="
display:flex;
align-items:center;
gap:7px;
margin:4px 0;
">

<div style="
width:85px;
font-size:10px;
">
${price(x.price)}
</div>

<div style="
flex:1;
height:12px;
background:#101d27;
border-radius:4px;
overflow:hidden;
">

<div style="
width:${width}%;
height:100%;
background:${
x.side==="BUY"
?"#17694f"
:"#713039"
};
"></div>

</div>

<div style="
width:75px;
font-size:10px;
text-align:left;
">
${num(x.qty)}
</div>

</div>

`;
})
.join("")
}

</div>
`;
}

function renderLiquidity(){

state.data.orderbookStats;

$("liquidity").innerHTML = `

<div class="grid">

<div class="card">
<div class="cardTitle">
BUY LIQUIDITY
</div>
<div class="cardValue greenText">
${num(a.buyLiquidity)}
</div>
</div>

<div class="card">
<div class="cardTitle">
SELL LIQUIDITY
</div>
<div class="cardValue redText">
${num(a.sellLiquidity)}
</div>
</div>

<div class="card">
<div class="cardTitle">
BUY SHARE
</div>
<div class="cardValue greenText">
${a.buyShare.toFixed(2)}%
</div>
</div>

<div class="card">
<div class="cardTitle">
SELL SHARE
</div>
<div class="cardValue redText">
${a.sellShare.toFixed(2)}%
</div>
</div>

</div>

<br>

<table class="table">

<thead>
<tr>
<th>Wall</th>
<th>Price</th>
<th>Quantity</th>
</tr>
</thead>

<tbody>

${
[
...(a.bidWalls || [])
.map(x=>({
...x,
wall:"BUY WALL"
})),

...(a.askWalls || [])
.map(x=>({
...x,
wall:"SELL WALL"
}))
]

canvas.addEventListener(
"pointerdown",
e=>{

state.drag=true;

state.startX =
e.clientX;

state.startOffset =
state.offset;

canvas.setPointerCapture(
e.pointerId
);
}
);

canvas.addEventListener(
"pointermove",
e=>{

if(!state.drag){
return;
}

const all =
state.data?.candles || [];

if(!all.length){
return;
}

const dx =
e.clientX-
state.startX;

const width =
canvas.getBoundingClientRect()
.width;

const count =
Math.max(
12,
Math.floor(
70/state.zoom
)
);

const candleWidth =
width/count;

const shift =
Math.round(
dx/candleWidth
);

state.offset =
Math.max(
0,
Math.min(
all.length-1,
state.startOffset-shift
)
);

draw();
}
);

canvas.addEventListener(
"pointerup",
e=>{

state.drag=false;

try{
canvas.releasePointerCapture(
e.pointerId
);
}catch{}
}
);

canvas.addEventListener(
"pointercancel",
()=>{
state.drag=false;
}
);

canvas.addEventListener(
"wheel",
e=>{

e.preventDefault();

if(e.deltaY<0){

state.zoom =
Math.min(
4,
state.zoom*1.15
);

}else{

state.zoom =
Math.max(
.5,
state.zoom/1.15
);
}

draw();

},
{
passive:false
}
);

canvas.addEventListener(
"click",
e=>{

const all =
state.data?.candles || [];

if(!all.length){
return;
}

const r =
canvas.getBoundingClientRect();

const cs =
visible();

const left=55;
const right=15;

const width =
r.width-left-right;

const gap =
width/cs.length;

const index =
Math.floor(
(
e.clientX-
r.left-
left
)/gap
);

if(
index>=0 &&
index<cs.length
){

const candle =
cs[index];

const found =
all.findIndex(
x =>
x.time ===
candle.time
);

if(found>=0){

state.selected =
found;

render();
}
}
}
);

.querySelectorAll(".tab")
.forEach(
x =>
x.classList.remove(
"active"
)
);

.querySelectorAll(".panel")
.forEach(
x =>

"active"
)
);

"active"
);

$("panel-"+tab.dataset.panel);

p.classList.add(
"active"
);
}

}
);

}
);
