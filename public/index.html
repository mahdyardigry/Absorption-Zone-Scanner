<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Absorption Zone Scanner V4</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#071018;
  color:#e8f0f7;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1600px;
  margin:auto;
  padding:12px;
}

.header{
  background:#0c1722;
  border:1px solid #1c3346;
  border-radius:16px;
  padding:15px;
  margin-bottom:10px;
}

.title{
  font-size:22px;
  font-weight:900;
  margin-bottom:6px;
}

.subtitle{
  color:#91a6b8;
  font-size:12px;
}

.status{
  margin-top:10px;
  padding:9px 12px;
  border-radius:10px;
  background:#07141e;
  border:1px solid #193548;
  font-size:12px;
}

.controls{
  display:grid;
  grid-template-columns:1.2fr 1.5fr 1fr auto;
  gap:8px;
  margin-bottom:10px;
}

.control{
  background:#0c1722;
  border:1px solid #1c3346;
  border-radius:12px;
  padding:8px;
}

.control label{
  display:block;
  color:#8299aa;
  font-size:11px;
  margin-bottom:5px;
}

input,
select{
  width:100%;
  height:40px;
  border-radius:8px;
  border:1px solid #294354;
  background:#071018;
  color:#fff;
  padding:0 10px;
  outline:none;
}

input:focus,
select:focus{
  border-color:#3c91c8;
}

.btn{
  border:1px solid #294354;
  background:#102432;
  color:#fff;
  border-radius:9px;
  padding:0 15px;
  min-height:40px;
  font-weight:700;
}

.btn:hover{
  background:#173447;
}

.btn.green{
  background:#0c3c30;
  border-color:#17694f;
}

.btn.red{
  background:#421b20;
  border-color:#713039;
}

.main{
  background:#0a141e;
  border:1px solid #1c3346;
  border-radius:16px;
  overflow:hidden;
}

.chartHeader{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:0 12px;
  border-bottom:1px solid #1c3346;
}

.chartTitle{
  font-size:14px;
  font-weight:900;
}

.chartInfo{
  color:#8da5b8;
  font-size:11px;
}

.chartWrap{
  position:relative;
  width:100%;
  height:470px;
  overflow:hidden;
  background:#050c12;
  touch-action:none;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

.chartHint{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:#51697a;
  pointer-events:none;
  font-size:12px;
}

.bottom{
  margin-top:10px;
  background:#0a141e;
  border:1px solid #1c3346;
  border-radius:16px;
  overflow:hidden;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border-bottom:1px solid #1c3346;
}

.tab{
  min-height:48px;
  border:0;
  border-left:1px solid #1c3346;
  background:#0b1721;
  color:#7890a2;
  font-size:11px;
  font-weight:800;
}

.tab:last-child{
  border-left:0;
}

.tab.active{
  background:#102839;
  color:#fff;
}

.panel{
  display:none;
  min-height:230px;
  padding:12px;
}

.panel.active{
  display:block;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.card{
  background:#071018;
  border:1px solid #1a3040;
  border-radius:10px;
  padding:10px;
}

.cardTitle{
  color:#7890a2;
  font-size:10px;
  margin-bottom:6px;
}

.cardValue{
  font-size:16px;
  font-weight:900;
}

.greenText{
  color:#35d49a;
}

.redText{
  color:#ff6472;
}

.yellowText{
  color:#ffc857;
}

.blueText{
  color:#61b8ff;
}

.table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}

.table th,
.table td{
  border-bottom:1px solid #172a38;
  padding:7px 5px;
  text-align:center;
}

.table th{
  color:#7991a3;
}

.footer{
  padding:10px 3px;
  color:#536a79;
  font-size:10px;
  text-align:center;
}

@media(max-width:900px){
  .controls{
    grid-template-columns:1fr 1fr;
  }

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .chartWrap{
    height:420px;
  }

  .tabs{
    overflow-x:auto;
    grid-template-columns:repeat(7,minmax(110px,1fr));
  }
}

@media(max-width:600px){
  .app{
    padding:7px;
  }

  .controls{
    grid-template-columns:1fr;
  }

  .chartWrap{
    height:390px;
  }

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .title{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="app">

  <section class="header">

    <div class="title">
      📊 Absorption Zone Scanner
    </div>

    <div class="subtitle">
      تحلیل واقعی Order Flow بر پایه داده‌های Bybit
    </div>

    <div id="status" class="status">
      🟡 در حال اتصال به Worker...
    </div>

  </section>

  <section class="controls">

    <div class="control">
      <label>بازار</label>

      <select id="category">
        <option value="linear">Futures</option>
        <option value="spot">Spot</option>
      </select>
    </div>

    <div class="control">
      <label>ارز</label>

      <input
        id="symbol"
        value="BTCUSDT"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
      >
    </div>

    <div class="control">
      <label>تایم‌فریم</label>

      <select id="interval">
        <option value="1">1m</option>
        <option value="3">3m</option>
        <option value="5">5m</option>
        <option value="15">15m</option>
        <option value="30">30m</option>
        <option value="60">1H</option>
      </select>
    </div>

    <div class="control" style="display:flex;align-items:end;">
      <button
        id="refreshBtn"
        class="btn green"
        style="width:100%;"
      >
        ↻ بروزرسانی
      </button>
    </div>

  </section>

  <section class="main">

    <div class="chartHeader">

      <div id="chartTitle" class="chartTitle">
        BTCUSDT · Futures · 1m
      </div>

      <div id="chartInfo" class="chartInfo">
        کندل را لمس کنید
      </div>

    </div>

    <div
      id="chartWrap"
      class="chartWrap"
    >

      <canvas id="chart"></canvas>

      <div
        id="chartHint"
        class="chartHint"
      >
        در حال دریافت بازار...
      </div>

    </div>

  </section>

  <section class="bottom">

    <div class="tabs">

      <button class="tab active" data-panel="footprint">
        🧱 Footprint
      </button>

      <button class="tab" data-panel="heatmap">
        🔥 Heatmap
      </button>

      <button class="tab" data-panel="liquidity">
        💧 Liquidity
      </button>

      <button class="tab" data-panel="absorption">
        🧲 Absorption
      </button>

      <button class="tab" data-panel="orderbook">
        📖 Order Book
      </button>

      <button class="tab" data-panel="delta">
        Δ Delta / CVD
      </button>

      <button class="tab" data-panel="large">
        🐋 Large Trades
      </button>

    </div>

    <div id="panel-footprint" class="panel active">
      <div id="footprintContent"></div>
    </div>

    <div id="panel-heatmap" class="panel">
      <div id="heatmapContent"></div>
    </div>

    <div id="panel-liquidity" class="panel">
      <div id="liquidityContent"></div>
    </div>

    <div id="panel-absorption" class="panel">
      <div id="absorptionContent"></div>
    </div>

    <div id="panel-orderbook" class="panel">
      <div id="orderbookContent"></div>
    </div>

    <div id="panel-delta" class="panel">
      <div id="deltaContent"></div>
    </div>

    <div id="panel-large" class="panel">
      <div id="largeContent"></div>
    </div>

  </section>

  <div class="footer">
    Absorption Zone Scanner · Bybit Real Market Data · V4
  </div>

</div>

<script>
"use strict";

const APP_VERSION = "ABSORPTION-ZONE-SCANNER-V4";

const state = {
  data: null,
  selected: -1,
  zoom: 1,
  offset: 0,
  dragging: false,
  dragStartX: 0,
  dragStartOffset: 0,
  auto: true,
  timer: null
};

const $ = id => document.getElementById(id);

const canvas = $("chart");
const ctx = canvas.getContext("2d");

function normalizeSymbol(value) {

  let s = String(value || "")
    .trim()
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "");

  if (
    !s ||
    s === "USDT" ||
    s === "BUSDT"
  ) {
    return "BTCUSDT";
  }

  if (s === "BTC") {
    return "BTCUSDT";
  }

  if (!s.endsWith("USDT")) {
    s += "USDT";
  }

  return s;
}

function currentSymbol() {
  const s = normalizeSymbol($("symbol").value);

  $("symbol").value = s;

  return s;
}

function currentCategory() {
  return $("category").value === "spot"
    ? "spot"
    : "linear";
}

function currentInterval() {
  return $("interval").value;
}

async function api(path, params = {}) {

  const url = new URL(
    path,
    window.location.origin
  );

  Object.entries(params).forEach(
    ([key, value]) => {
      if (
        value !== undefined &&
        value !== null &&
        value !== ""
      ) {
        url.searchParams.set(
          key,
          value
        );
      }
    }
  );

  url.searchParams.set(
    "_v",
    Date.now().toString()
  );

  let response;

  try {

    response = await fetch(
      url.toString(),
      {
        method: "GET",
        cache: "no-store",
        headers: {
          "accept": "application/json",
          "cache-control": "no-cache"
        }
      }
    );

  } catch (err) {

    throw new Error(
      "اتصال به Worker برقرار نشد: " +
      (err?.message || "Network error")
    );
  }

  const text =
    await response.text();

  if (!text || !text.trim()) {

    throw new Error(
      "پاسخ Worker خالی است"
    );
  }

  let data;

  try {

    data = JSON.parse(text);

  } catch {

    const preview =
      text
        .replace(/\s+/g, " ")
        .slice(0, 180);

    throw new Error(
      "Worker پاسخ JSON نداده است: " +
      preview
    );
  }

  if (!response.ok) {

    throw new Error(
      data?.error ||
      `خطای Worker ${response.status}`
    );
  }

  if (data?.ok === false) {

    throw new Error(
      data.error ||
      "خطای Worker"
    );
  }

  return data;
}

function setStatus(
  text,
  type = "normal"
) {

  const el = $("status");

  el.textContent = text;

  if (type === "error") {
    el.style.color = "#ff6472";
  } else if (type === "ok") {
    el.style.color = "#35d49a";
  } else {
    el.style.color = "#ffc857";
  }
}

async function checkHealth() {

  try {

    const data =
      await api("/api/health");

    setStatus(
      `🟢 Worker متصل است · ${data.version}`,
      "ok"
    );

    return true;

  } catch (err) {

    setStatus(
      "🔴 " + err.message,
      "error"
    );

    return false;
  }
}

async function loadMarket() {

  const symbol =
    currentSymbol();

  const category =
    currentCategory();

  const interval =
    currentInterval();

  $("chartHint").textContent =
    "در حال دریافت اطلاعات بازار...";

  setStatus(
    `🟡 دریافت ${symbol} از Bybit...`
  );

  try {

    const data =
      await api(
        "/api/market",
        {
          category,
          symbol,
          interval
        }
      );

    state.data = data;

    if (
      !data.candles ||
      !data.candles.length
    ) {
      throw new Error(
        "برای این نماد کندل دریافت نشد"
      );
    }

    state.selected =
      data.candles.length - 1;

    $("chartHint").style.display =
      "none";

    $("chartTitle").textContent =
      `${data.symbol} · ${
        data.category === "spot"
          ? "Spot"
          : "Futures"
      } · ${intervalLabel(interval)}`;

    setStatus(
      `🟢 اتصال برقرار است — Bybit · ${data.symbol}`,
      "ok"
    );

    renderAll();

  } catch (err) {

    $("chartHint").style.display =
      "block";

    $("chartHint").textContent =
      "خطا در دریافت اطلاعات بازار";

    setStatus(
      "🔴 " + err.message,
      "error"
    );
  }
}

function intervalLabel(v) {

  const map = {
    "1":"1m",
    "3":"3m",
    "5":"5m",
    "15":"15m",
    "30":"30m",
    "60":"1H"
  };

  return map[v] || v;
}

function resizeCanvas() {

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    Math.max(
      1,
      Math.min(
        2,
        window.devicePixelRatio || 1
      )
    );

  canvas.width =
    Math.floor(rect.width * dpr);

  canvas.height =
    Math.floor(rect.height * dpr);

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  drawChart();
}

function visibleCandles() {

  const candles =
    state.data?.candles || [];

  if (!candles.length) {
    return [];
  }

  const base = 70;

  const count = Math.max(
    12,
    Math.min(
      candles.length,
      Math.floor(base / state.zoom)
    )
  );

  const end =
    Math.min(
      candles.length,
      candles.length - state.offset
    );

  const start =
    Math.max(
      0,
      end - count
    );

  return candles.slice(
    start,
    end
  );
}

function drawChart() {

  const rect =
    canvas.getBoundingClientRect();

  const w = rect.width;
  const h = rect.height;

  ctx.clearRect(
    0,
    0,
    w,
    h
  );

  ctx.fillStyle =
    "#050c12";

  ctx.fillRect(
    0,
    0,
    w,
    h
  );

  const candles =
    state.data?.candles || [];

  if (!candles.length) {
    return;
  }

  const visible =
    visibleCandles();

  if (!visible.length) {
    return;
  }

  const max =
    Math.max(
      ...visible.map(c => c.high)
    );

  const min =
    Math.min(
      ...visible.map(c => c.low)
    );

  const range =
    Math.max(
      max - min,
      0.00000001
    );

  const left = 50;
  const right = 15;
  const top = 15;
  const bottom = 35;

  const chartW =
    w - left - right;

  const chartH =
    h - top - bottom;

  const gap =
    chartW / visible.length;

  function y(price) {

    return top +
      (max - price) /
      range *
      chartH;
  }

  for (let i = 0; i <= 5; i++) {

    const yy =
      top + chartH * i / 5;

    ctx.strokeStyle =
      "#122431";

    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.moveTo(
      left,
      yy
    );
    ctx.lineTo(
      w - right,
      yy
    );
    ctx.stroke();

    const price =
      max - range * i / 5;

    ctx.fillStyle =
      "#5d7485";

    ctx.font =
      "10px Tahoma";

    ctx.textAlign =
      "right";

    ctx.fillText(
      formatPrice(price),
      left - 5,
      yy + 3
    );
  }

  visible.forEach(
    (candle, i) => {

      const x =
        left +
        i * gap +
        gap / 2;

      const openY =
        y(candle.open);

      const closeY =
        y(candle.close);

      const highY =
        y(candle.high);

      const lowY =
        y(candle.low);

      const bullish =
        candle.close >= candle.open;

      const selected =
        candle.time ===
        candles[state.selected]?.time;

      if (selected) {

        ctx.fillStyle =
          "rgba(255,200,87,.10)";

        ctx.fillRect(
          x - gap / 2,
          top,
          gap,
          chartH
        );
      }

      ctx.strokeStyle =
        bullish
          ? "#35d49a"
          : "#ff6472";

      ctx.lineWidth = 1;

      ctx.beginPath();

      ctx.moveTo(
        x,
        highY
      );

      ctx.lineTo(
        x,
        lowY
      );

      ctx.stroke();

      const bodyTop =
        Math.min(
          openY,
          closeY
        );

      const bodyHeight =
        Math.max(
          1,
          Math.abs(
            closeY - openY
          )
        );

      ctx.fillStyle =
        bullish
          ? "#35d49a"
          : "#ff6472";

      ctx.fillRect(
        x - Math.max(2, gap * .27),
        bodyTop,
        Math.max(4, gap * .54),
        bodyHeight
      );

      if (selected) {

        ctx.strokeStyle =
          "#ffc857";

        ctx.lineWidth = 2;

        ctx.strokeRect(
          x - Math.max(3, gap * .3),
          bodyTop - 2,
          Math.max(6, gap * .6),
          bodyHeight + 4
        );
      }
    }
  );

  const last =
    candles[candles.length - 1];

  if (last) {

    const yy =
      y(last.close);

    ctx.strokeStyle =
      "#ffc857";

    ctx.setLineDash([
      5,
      5
    ]);

    ctx.beginPath();

    ctx.moveTo(
      left,
      yy
    );

    ctx.lineTo(
      w - right,
      yy
    );

    ctx.stroke();

    ctx.setLineDash([]);

    ctx.fillStyle =
      "#ffc857";

    ctx.font =
      "11px Tahoma";

    ctx.textAlign =
      "left";

    ctx.fillText(
      formatPrice(last.close),
      w - right - 65,
      yy - 5
    );
  }

  if (
    state.selected >= 0 &&
    candles[state.selected]
  ) {

    const c =
      candles[state.selected];

    $("chartInfo").textContent =
      `${formatDate(c.time)} · O ${formatPrice(c.open)} · H ${formatPrice(c.high)} · L ${formatPrice(c.low)} · C ${formatPrice(c.close)}`;
  }
}

function formatPrice(v) {

  const n = Number(v);

  if (!Number.isFinite(n)) {
    return "-";
  }

  if (n >= 1000) {
    return n.toFixed(2);
  }

  if (n >= 1) {
    return n.toFixed(4);
  }

  if (n >= .01) {
    return n.toFixed(5);
  }

  return n.toPrecision(6);
}

function formatNumber(v) {

  const n = Number(v);

  if (!Number.isFinite(n)) {
    return "0";
  }

  return n.toLocaleString(
    "en-US",
    {
      maximumFractionDigits: 4
    }
  );
}

function formatDate(t) {

  return new Date(t)
    .toLocaleString(
      "fa-IR",
      {
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      }
    );
}

function renderAll() {

  renderFootprint();
  renderHeatmap();
  renderLiquidity();
  renderAbsorption();
  renderOrderbook();
  renderDelta();
  renderLargeTrades();

  drawChart();
}

function renderFootprint() {

  const d =
    state.data;

  if (!d) return;

  const candle =
    d.footprint?.find(
      x =>
        x.time ===
        d.candles[state.selected]?.time
    );

  if (!candle) {

    $("footprintContent").innerHTML =
      `<div class="card">
        اطلاعات Footprint برای این کندل وجود ندارد.
      </div>`;

    return;
  }

  const rows =
    candle.levels || [];

  const html = `

    <div class="grid">

      <div class="card">
        <div class="cardTitle">Buy Volume</div>
        <div class="cardValue greenText">
          ${formatNumber(candle.buyVolume)}
        </div>
      </div>

      <div class="card">
        <div class="cardTitle">Sell Volume</div>
        <div class="cardValue redText">
          ${formatNumber(candle.sellVolume)}
        </div>
      </div>

      <div class="card">
        <div class="cardTitle">Delta</div>
        <div class="cardValue ${
          candle.delta >= 0
            ? "greenText"
            : "redText"
        }">
          ${formatNumber(candle.delta)}
        </div>
      </div>

      <div class="card">
        <div class="cardTitle">Pressure</div>
        <div class="cardValue yellowText">
          ${pressureFa(candle.pressure)}
        </div>
      </div>

    </div>

    <br>

    <table class="table">

      <thead>
        <tr>
          <th>Price</th>
          <th>Buy</th>
          <th>Sell</th>
          <th>Delta</th>
          <th>Trades</th>
        </tr>
      </thead>

      <tbody>

        ${
          rows
            .slice(0,80)
            .map(level => `
              <tr>
                <td>
                  ${formatPrice(level.price)}
                </td>

                <td class="greenText">
                  ${formatNumber(level.buyVolume)}
                </td>

                <td class="redText">
                  ${formatNumber(level.sellVolume)}
                </td>

                <td class="${
                  level.delta >= 0

canvas.addEventListener(
  "pointerdown",
  e => {

    state.dragging = true;

    state.dragStartX =
      e.clientX;

    state.dragStartOffset =
      state.offset;

    canvas.setPointerCapture(
      e.pointerId
    );
  }
);

canvas.addEventListener(
  "pointermove",
  e => {

    if (!state.dragging) {
      return;
    }

    const candles =
      state.data?.candles || [];

    if (!candles.length) {
      return;
    }

    const dx =
      e.clientX -
      state.dragStartX;

    const width =
      canvas.getBoundingClientRect()
        .width;

    const visible =
      Math.max(
        12,
        Math.floor(
          70 / state.zoom
        )
      );

    const shift =
      Math.round(
        dx /
        Math.max(
          1,
          width / visible
        )
      );

    state.offset =
      Math.max(
        0,
        Math.min(
          candles.length - 1,
          state.dragStartOffset - shift
        )
      );

    drawChart();
  }
);

canvas.addEventListener(
  "pointerup",
  e => {

    state.dragging = false;

    try {
      canvas.releasePointerCapture(
        e.pointerId
      );
    } catch {}
  }
);

canvas.addEventListener(
  "pointercancel",
  () => {
    state.dragging = false;
  }
);

canvas.addEventListener(
  "wheel",
  e => {

    e.preventDefault();

    const oldZoom =
      state.zoom;

    if (e.deltaY < 0) {
      state.zoom =
        Math.min(
          4,
          state.zoom * 1.15
        );
    } else {
      state.zoom =
        Math.max(
          .5,
          state.zoom / 1.15
        );
    }

    if (
      Math.abs(
        state.zoom - oldZoom
      ) > .001
    ) {
      drawChart();
    }
  },
  {
    passive:false
  }
);

canvas.addEventListener(
  "click",
  e => {

    const candles =
      state.data?.candles || [];

    if (!candles.length) {
      return;
    }

    const rect =
      canvas.getBoundingClientRect();

    const visible =
      visibleCandles();

    if (!visible.length) {
      return;
    }

    const left = 50;
    const right = 15;

    const width =
      rect.width -
      left -
      right;

    const gap =
      width /
      visible.length;

    const index =
      Math.floor(
        (e.clientX -
          rect.left -
          left) /
        gap
      );

    if (
      index >= 0 &&
      index < visible.length
    ) {

      const candle =
        visible[index];

      const globalIndex =
        candles.findIndex(
          x =>
            x.time ===
            candle.time
        );

      if (globalIndex >= 0) {

        state.selected =
          globalIndex;

        renderAll();
      }
    }
  }
);

document
  .querySelectorAll(".tab")
  .forEach(tab => {

    tab.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".tab")
          .forEach(
            x =>
              x.classList.remove(
                "active"
              )
          );

        document
          .querySelectorAll(".panel")
          .forEach(
            x =>
              x.classList.remove(
                "active"
              )
          );

        tab.classList.add(
          "active"
        );

        const panel =
          $("panel-" +
            tab.dataset.panel);

        if (panel) {
          panel.classList.add(
            "active"
          );
        }
      }
    );
  });

);

async function start() {

  $("symbol").value =
    "BTCUSDT";

  await checkHealth();

  await loadMarket();

  if (state.timer) {
    clearInterval(
      state.timer
    );
  }

  state.timer =
    setInterval(
      () => {

        if (!state.dragging) {
          loadMarket();
        }

      },
      5000
    );
}

resizeCanvas();

start();
