<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
/>
<title>Absorption Zone Scanner</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#071018;
  color:#e8f0f7;
  font-family:
    Tahoma,
    Arial,
    sans-serif;
}

body{
  overflow-x:hidden;
}

button,
select,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1600px;
  margin:auto;
  padding:10px;
}

.header{
  border:1px solid #1c3344;
  background:#0b1722;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
}

.title{
  font-size:21px;
  font-weight:900;
  margin-bottom:5px;
}

.subtitle{
  color:#91a6b7;
  font-size:12px;
}

.status{
  margin-top:10px;
  padding:9px 12px;
  border-radius:9px;
  background:#101e2a;
  color:#70e3a3;
  font-size:13px;
}

.status.error{
  color:#ff7070;
}

.controls{
  display:grid;
  grid-template-columns:
    1fr
    1.5fr
    1fr
    auto;
  gap:8px;
  margin-bottom:10px;
}

.control{
  background:#0b1722;
  border:1px solid #1c3344;
  border-radius:12px;
  padding:8px;
}

.control label{
  display:block;
  color:#7e95a7;
  font-size:11px;
  margin-bottom:5px;
}

input,
select{
  width:100%;
  border:1px solid #294253;
  background:#08121b;
  color:#fff;
  border-radius:8px;
  padding:10px;
  outline:none;
}

.action{
  border:1px solid #23506a;
  background:#102c3b;
  color:#dff7ff;
  border-radius:10px;
  padding:10px 16px;
  min-width:110px;
}

.action:active{
  transform:scale(.98);
}

.chart-card{
  border:1px solid #1c3344;
  border-radius:14px;
  background:#08131d;
  overflow:hidden;
}

.chart-head{
  height:42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  border-bottom:1px solid #172b39;
}

.chart-title{
  font-size:13px;
  font-weight:bold;
}

.chart-info{
  color:#8299aa;
  font-size:11px;
}

.chart-wrap{
  position:relative;
  width:100%;
  height:520px;
  overflow:hidden;
  touch-action:none;
}

#chart{
  display:block;
  width:100%;
  height:100%;
}

.empty{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#718797;
  pointer-events:none;
  font-size:13px;
}

.nav{
  display:grid;
  grid-template-columns:
    repeat(7,1fr);
  gap:6px;
  margin-top:10px;
}

.nav button{
  min-height:42px;
  border:1px solid #1d394b;
  background:#0b1722;
  color:#9eb1bf;
  border-radius:9px;
  font-size:11px;
}

.nav button.active{
  color:#fff;
  border-color:#3984a7;
  background:#102b3b;
}

.panel{
  margin-top:10px;
  border:1px solid #1c3344;
  background:#0b1722;
  border-radius:14px;
  padding:10px;
  min-height:180px;
}

.panel-title{
  font-weight:900;
  font-size:15px;
  margin-bottom:9px;
}

.cards{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:7px;
}

.card{
  background:#08131d;
  border:1px solid #1b3344;
  border-radius:9px;
  padding:9px;
  min-width:0;
}

.card .label{
  color:#728999;
  font-size:10px;
  margin-bottom:5px;
}

.card .value{
  font-size:13px;
  font-weight:900;
  direction:ltr;
  text-align:right;
  overflow:hidden;
  text-overflow:ellipsis;
}

.green{
  color:#42df91!important;
}

.red{
  color:#ff5e6d!important;
}

.yellow{
  color:#f5cf58!important;
}

.blue{
  color:#58b9ff!important;
}

.neutral{
  color:#c1cbd2!important;
}

.table-wrap{
  width:100%;
  overflow:auto;
  border:1px solid #1a303f;
  border-radius:9px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:620px;
}

th,
td{
  padding:7px 6px;
  border-bottom:1px solid #162a37;
  text-align:center;
  font-size:11px;
  white-space:nowrap;
}

th{
  background:#0e202d;
  color:#9db1bf;
  position:sticky;
  top:0;
}

tr:last-child td{
  border-bottom:0;
}

.level-buy{
  color:#3fe394;
}

.level-sell{
  color:#ff6170;
}

.level-delta-pos{
  color:#42df91;
}

.level-delta-neg{
  color:#ff5e6d;
}

.message{
  padding:14px;
  text-align:center;
  color:#8094a3;
}

.selected{
  margin-top:8px;
  border:1px solid #254558;
  background:#0a1823;
  border-radius:9px;
  padding:8px;
  font-size:11px;
  color:#9eb1be;
}

.legend{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  color:#7e95a7;
  font-size:10px;
  margin-top:8px;
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  margin-left:4px;
}

@media(max-width:900px){
  .controls{
    grid-template-columns:
      1fr 1fr;
  }

  .cards{
    grid-template-columns:
      repeat(2,1fr);
  }

  .nav{
    grid-template-columns:
      repeat(4,1fr);
  }

  .chart-wrap{
    height:430px;
  }
}

@media(max-width:560px){
  .app{
    padding:6px;
  }

  .header{
    padding:10px;
  }

  .title{
    font-size:18px;
  }

  .controls{
    grid-template-columns:1fr 1fr;
  }

  .control.symbol{
    grid-column:1 / -1;
  }

  .action{
    width:100%;
  }

  .nav{
    grid-template-columns:
      repeat(2,1fr);
  }

  .chart-wrap{
    height:360px;
  }

  .cards{
    grid-template-columns:
      repeat(2,1fr);
  }
}

@media(max-width:380px){
  .chart-wrap{
    height:320px;
  }
}
</style>
</head>

<body>

<div class="app">

  <section class="header">
    <div class="title">
      📊 Absorption Zone Scanner
    </div>

    <div class="subtitle">
      تحلیل Order Flow واقعی Bybit
    </div>

    <div id="status" class="status">
      🟡 در حال اتصال به Bybit...
    </div>
  </section>

  <section class="controls">

    <div class="control">
      <label>بازار</label>

      <select id="category">
        <option value="linear">Futures</option>
        <option value="spot">Spot</option>
      </select>
    </div>

    <div class="control symbol">
      <label>ارز</label>

      <input
        id="symbol"
        value="BTCUSDT"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <div class="control">
      <label>تایم‌فریم</label>

      <select id="interval">
        <option value="1">1m</option>
        <option value="3">3m</option>
        <option value="5">5m</option>
        <option value="15">15m</option>
        <option value="30">30m</option>
        <option value="60">1H</option>
      </select>
    </div>

    <div class="control">
      <label>&nbsp;</label>

      <button
        id="refresh"
        class="action"
      >
        ↻ بروزرسانی
      </button>
    </div>

  </section>

  <section class="chart-card">

    <div class="chart-head">
      <div class="chart-title">
        Bybit Order Flow
      </div>

      <div
        id="chartInfo"
        class="chart-info"
      >
        کندل را لمس کنید
      </div>
    </div>

    <div
      id="chartWrap"
      class="chart-wrap"
    >
      <canvas id="chart"></canvas>

      <div
        id="empty"
        class="empty"
      >
        در حال دریافت داده...
      </div>
    </div>

  </section>

  <div class="nav">

    <button
      data-panel="footprint"
      class="active"
    >
      🧱Footprint
    </button>

    <button data-panel="heatmap">
      🔥Heatmap
    </button>

    <button data-panel="liquidity">
      💧Liquidity
    </button>

    <button data-panel="absorption">
      🧲Absorption
    </button>

    <button data-panel="orderbook">
      📖Order Book
    </button>

    <button data-panel="delta">
      ΔDelta / CVD
    </button>

    <button data-panel="large">
      🐋Large Trades
    </button>

  </div>

  <section
    id="panel"
    class="panel"
  ></section>

</div>

<script>
const state = {
  category: "linear",
  symbol: "BTCUSDT",
  interval: "1",
  candles: [],
  trades: [],
  orderbook: null,
  tradeStats: null,
  ticker: null,
  footprint: null,
  selected: -1,
  panel: "footprint",
  loading: false
};

const chart = document.getElementById("chart");
const ctx = chart.getContext("2d");
const wrap = document.getElementById("chartWrap");

const statusEl =
  document.getElementById("status");

const emptyEl =
  document.getElementById("empty");

const chartInfo =
  document.getElementById("chartInfo");

const panelEl =
  document.getElementById("panel");

function esc(v) {
  return String(v ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function n(v, digits = 4) {
  const x = Number(v);

  if (!Number.isFinite(x)) {
    return "0";
  }

  return x.toLocaleString(
    "en-US",
    {
      maximumFractionDigits: digits
    }
  );
}

function pct(v) {
  return n(v, 2) + "%";
}

function cls(v) {
  return Number(v) >= 0
    ? "green"
    : "red";
}

function apiUrl(path, params = {}) {
  const url = new URL(
    path,
    window.location.origin
  );

  for (const [k, v] of Object.entries(params)) {
    if (
      v !== undefined &&
      v !== null &&
      v !== ""
    ) {
      url.searchParams.set(k, v);
    }
  }

  return url.toString();
}

async function api(path, params = {}) {
  const url = apiUrl(path, params);

  let response;

  try {
    response = await fetch(url, {
      method: "GET",
      cache: "no-store",
      headers: {
        "Accept": "application/json"
      }
    });
  } catch (e) {
    throw new Error(
      "اتصال به Worker برقرار نشد"
    );
  }

  const text =
    await response.text();

  if (!text || !text.trim()) {
    throw new Error(
      `پاسخ خالی از Worker (${response.status})`
    );
  }

  let data;

  try {
    data = JSON.parse(text);
  } catch {
    throw new Error(
      `پاسخ Worker JSON نیست (${response.status})`
    );
  }

  if (!response.ok) {
    throw new Error(
      data?.error ||
      `HTTP ${response.status}`
    );
  }

  if (data?.ok === false) {
    throw new Error(
      data.error ||
      "خطای API"
    );
  }

  return data;
}

function setStatus(text, error = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle(
    "error",
    Boolean(error)
  );
}

function resizeCanvas() {
  const rect =
    chart.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  chart.width =
    Math.max(1, Math.floor(rect.width * dpr));

  chart.height =
    Math.max(1, Math.floor(rect.height * dpr));

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  drawChart();
}

function getPriceRange(candles) {
  if (!candles.length) {
    return {
      min: 0,
      max: 1
    };
  }

  let min = Infinity;
  let max = -Infinity;

  for (const c of candles) {
    min = Math.min(min, c.low);
    max = Math.max(max, c.high);
  }

  if (
    !Number.isFinite(min) ||
    !Number.isFinite(max)
  ) {
    return {
      min: 0,
      max: 1
    };
  }

  const pad =
    (max - min) * 0.08 ||
    Math.abs(max) * 0.002 ||
    1;

  return {
    min: min - pad,
    max: max + pad
  };
}

function drawChart() {
  const w =
    chart.clientWidth;

  const h =
    chart.clientHeight;

  if (!w || !h) return;

  ctx.clearRect(0, 0, w, h);

  const candles =
    state.candles;

  if (!candles.length) {
    emptyEl.style.display =
      "flex";
    return;
  }

  emptyEl.style.display =
    "none";

  const rightAxis = 72;
  const bottomAxis = 25;
  const left = 8;
  const top = 10;

  const plotW =
    w - left - rightAxis;

  const plotH =
    h - top - bottomAxis;

  const range =
    getPriceRange(candles);

  const min = range.min;
  const max = range.max;

  const visibleCount =
    Math.min(
      candles.length,
      Math.max(
        10,
        Math.floor(plotW / 9)
      )
    );

  const start =
    Math.max(
      0,
      candles.length - visibleCount
    );

  const visible =
    candles.slice(start);

  const step =
    plotW / visible.length;

  function y(price) {
    return top +
      (max - price) /
      (max - min) *
      plotH;
  }

  ctx.strokeStyle =
    "#142733";

  ctx.lineWidth = 1;

  for (let i = 0; i <= 5; i++) {
    const yy =
      top + plotH * i / 5;

    ctx.beginPath();
    ctx.moveTo(left, yy);
    ctx.lineTo(
      left + plotW,
      yy
    );
    ctx.stroke();

    const price =
      max -
      (max - min) * i / 5;

    ctx.fillStyle =
      "#738997";

    ctx.font =
      "10px Arial";

    ctx.textAlign =
      "left";

    ctx.fillText(
      n(price, 6),
      left + plotW + 7,
      yy + 3
    );
  }

  visible.forEach(
    (c, i) => {
      const x =
        left +
        i * step +
        step / 2;

      const openY =
        y(c.open);

      const closeY =
        y(c.close);

      const highY =
        y(c.high);

      const lowY =
        y(c.low);

      const up =
        c.close >= c.open;

      ctx.strokeStyle =
        up
          ? "#38d98b"
          : "#ff5c6c";

      ctx.fillStyle =
        up
          ? "#38d98b"
          : "#ff5c6c";

      ctx.lineWidth = 1;

      ctx.beginPath();

      ctx.moveTo(
        x,
        highY
      );

      ctx.lineTo(
        x,
        lowY
      );

      ctx.stroke();

      const bodyW =
        Math.max(
          2,
          Math.min(
            step * 0.65,
            14
          )
        );

      const bodyTop =
        Math.min(
          openY,
          closeY
        );

      const bodyH =
        Math.max(
          1,
          Math.abs(
            closeY - openY
          )
        );

      ctx.fillRect(
        x - bodyW / 2,
        bodyTop,
        bodyW,
        bodyH
      );

      if (
        start + i ===
        state.selected
      ) {
        ctx.strokeStyle =
          "#f4d35e";

        ctx.lineWidth = 2;

        ctx.strokeRect(
          x - bodyW / 2 - 3,
          bodyTop - 3,
          bodyW + 6,
          bodyH + 6
        );

        ctx.beginPath();
        ctx.moveTo(
          x,
          top
        );
        ctx.lineTo(
          x,
          top + plotH
        );
        ctx.stroke();
      }
    }
  );

  ctx.fillStyle =
    "#6e8594";

  ctx.font =
    "10px Arial";

  ctx.textAlign =
    "center";

  const labels =
    Math.min(
      6,
      visible.length
    );

  for (
    let i = 0;
    i < labels;
    i++
  ) {
    const idx =
      Math.floor(
        i *
        (visible.length - 1) /
        Math.max(1, labels - 1)
      );

    const c =
      visible[idx];

    const x =
      left +
      idx * step +
      step / 2;

    const d =
      new Date(c.time);

    const text =
      d.toLocaleTimeString(
        "en-US",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    ctx.fillText(
      text,
      x,
      h - 8
    );
  }
}

function candleAt(clientX) {
  const rect =
    chart.getBoundingClientRect();

  const x =
    clientX - rect.left;

  const w =
    rect.width;

  const rightAxis = 72;
  const left = 8;

  const plotW =
    w - left - rightAxis;

  const visibleCount =
    Math.min(
      state.candles.length,
      Math.max(
        10,
        Math.floor(plotW / 9)
      )
    );

  const start =
    Math.max(
      0,
      state.candles.length -
      visibleCount
    );

  const step =
    plotW / visibleCount;

  const idx =
    Math.floor(
      (x - left) / step
    );

  if (
    idx < 0 ||
    idx >= visibleCount
  ) {
    return -1;
  }

  return start + idx;
}

async function selectCandle(index) {
  if (
    index < 0 ||
    index >= state.candles.length
  ) {
    return;
  }

  state.selected = index;

  const c =
    state.candles[index];

  chartInfo.textContent =
    new Date(c.time)
      .toLocaleString(
        "fa-IR"
      );

  drawChart();

  await loadFootprint();
  renderPanel();
}

let pointerDown = false;
let pointerMoved = false;
let pointerStartX = 0;

chart.addEventListener(
  "pointerdown",
  e => {
    pointerDown = true;
    pointerMoved = false;
    pointerStartX = e.clientX;

    try {
      chart.setPointerCapture(
        e.pointerId
      );
    } catch {}
  }
);

chart.addEventListener(
  "pointermove",
  e => {
    if (!pointerDown) return;

    if (
      Math.abs(
        e.clientX -
        pointerStartX
      ) > 8
    ) {
      pointerMoved = true;
    }
  }
);

chart.addEventListener(
  "pointerup",
  async e => {
    if (!pointerDown) return;

    pointerDown = false;

    if (pointerMoved) return;

    const index =
      candleAt(e.clientX);

    if (index >= 0) {
      await selectCandle(index);
    }
  }
);

chart.addEventListener(
  "wheel",
  e => {
    e.preventDefault();

    if (!state.candles.length) {
      return;
    }

    const direction =
      e.deltaY > 0 ? 1 : -1;

    const current =
      state.selected >= 0
        ? state.selected
        : state.candles.length - 1;

    const next =
      clamp(
        current + direction,
        0,
        state.candles.length - 1
      );

    selectCandle(next);
  },
  { passive:false }
);

window.addEventListener(
  "resize",
  resizeCanvas
);

document
  .getElementById("category")
  .addEventListener(
    "change",
    async e => {
      state.category =
        e.target.value;

      await load();
    }
  );

document
  .getElementById("symbol")
  .addEventListener(
    "change",
    async e => {
      state.symbol =
        e.target.value
          .trim()
          .toUpperCase();

      e.target.value =
        state.symbol;

      await load();
    }
  );

document
  .getElementById("interval")
  .addEventListener(
    "change",
    async e => {
      state.interval =
        e.target.value;

      await load();
    }
  );

document
  .getElementById("refresh")
  .addEventListener(
    "click",
    load
  );

document
  .querySelectorAll(".nav button")
  .forEach(button => {
    button.addEventListener(
      "click",
      async () => {
        document
          .querySelectorAll(
            ".nav button"
          )
          .forEach(x =>
            x.classList.remove(
              "active"
            )
          );

        button.classList.add(
          "active"
        );

        state.panel =
          button.dataset.panel;

        if (
          state.panel ===
          "footprint"
        ) {
          await loadFootprint();
        }

        renderPanel();
      }
    );
  });

async function load() {
  if (state.loading) return;

  state.loading = true;

  setStatus(
    "🟡 در حال دریافت داده واقعی Bybit..."
  );

  try {
    const data =
      await api(
        "/api/market",
        {
          category:
            state.category,
          symbol:
            state.symbol,
          interval:
            state.interval
        }
      );

    state.candles =
      Array.isArray(
        data.candles
      )
        ? data.candles
        : [];

    state.trades =
      Array.isArray(
        data.trades
      )
        ? data.trades
        : [];

    state.orderbook =
      data.orderbook ||
      null;

    state.tradeStats =
      data.tradeStats ||
      null;

    state.ticker =
      data.ticker ||
      null;

    if (
      state.selected < 0 ||
      state.selected >=
      state.candles.length
    ) {
      state.selected =
        state.candles.length - 1;
    }

    if (state.selected >= 0) {
      chartInfo.textContent =
        new Date(
          state.candles[
            state.selected
          ].time
        ).toLocaleString(
          "fa-IR"
        );
    }

    setStatus(
      `🟢 اتصال برقرار است — Bybit · ${state.symbol}`
    );

    drawChart();

    await loadFootprint();

    renderPanel();

  } catch (e) {
    setStatus(
      "🔴 " +
      (e.message ||
        "خطای دریافت اطلاعات"),
      true
    );

    emptyEl.style.display =
      "flex";

    emptyEl.textContent =
      "خطا در دریافت اطلاعات بازار";

    panelEl.innerHTML =
      `<div class="message">
        ${esc(
          e.message ||
          "خطای نامشخص"
        )}
      </div>`;
  } finally {
    state.loading = false;
  }
}

async function loadFootprint() {
  if (
    state.selected < 0 ||
    !state.candles[
      state.selected
    ]
  ) {
    return;
  }

  const candle =
    state.candles[
      state.selected
    ];

  try {
    const data =
      await api(
        "/api/footprint",
        {
          category:
            state.category,
          symbol:
            state.symbol,
          interval:
            state.interval,
          candleTime:
            candle.time
        }
      );

    state.footprint =
      data.footprint ||
      null;

  } catch (e) {
    state.footprint = null;
  }
}

function card(
  label,
  value,
  color = ""
) {
  return `
    <div class="card">
      <div class="label">
        ${esc(label)}
      </div>
      <div class="value ${color}">
        ${esc(value)}
      </div>
    </div>
  `;
}

function renderPanel() {
  switch (state.panel) {
    case "heatmap":
      renderHeatmap();
      break;

    case "liquidity":
      renderLiquidity();
      break;

    case "absorption":
      renderAbsorption();
      break;

    case "orderbook":
      renderOrderbook();
      break;

    case "delta":
      renderDelta();
      break;

    case "large":
      renderLarge();
      break;

    default:
      renderFootprint();
  }
}

function renderHeatmap() {
  const levels =
    state.footprint?.levels ||
    [];

  if (!levels.length) {
    panelEl.innerHTML =
      `<div class="message">
        Heatmap داده‌ای ندارد
      </div>`;
    return;
  }

  const max =
    Math.max(
      ...levels.map(x =>
        Number(x.volume) || 0
      )
    ) || 1;

  const rows =
    levels.map(l => {
      const intensity =
        clamp(
          l.volume / max,
          0,
          1
        );

      const width =
        Math.round(
          intensity * 100
        );

      return `
        <tr>
          <td>
            ${n(l.price, 8)}
          </td>

          <td>
            ${n(l.volume, 6)}
          </td>

          <td>
            <div style="
              width:${width}%;
              height:12px;
              background:
                rgba(80,180,255,.55);
              border-radius:4px;
              min-width:2px;
            "></div>
          </td>

          <td class="${cls(l.delta)}">
            ${n(l.delta, 6)}
          </td>
        </tr>
      `;
    }).join("");

  panelEl.innerHTML = `
    <div class="panel-title">
      🔥 Heatmap — Volume By Price
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Price</th>
            <th>Volume</th>
            <th>Intensity</th>
            <th>Delta</th>
          </tr>
        </thead>

        <tbody>
          ${rows}
        </tbody>
      </table>
    </div>
  `;
}

function renderDelta() {

    state.trades || [];

    trades.slice(-100)

            ? t.qty

        cvd += d;

        return `
          <tr>
            <td>
              ${new Date(
                t.time
              ).toLocaleTimeString(
                "en-US"
              )}
            </td>

            <td>
              ${n(t.price, 8)}
            </td>

            <td class="${
              t.side === "buy"
                ? "green"
                : "red"
            }">
              ${t.side.toUpperCase()}

            <td>
              ${n(t.qty, 6)}
            </td>

            <td class="${cls(d)}">
              ${n(d, 6)}
            </td>

            <td class="${cls(cvd)}">
              ${n(cvd, 6)}

      )}

        "Delta %",
        pct(s.deltaPercent),
        cls(s.deltaPercent)
      )}

      ${card(
        "CVD",
        n(s.cvd, 6),
        cls(s.cvd)
      )}

      ${card(
        "Buy Trades",
        n(s.buyTrades, 0),

        "Sell Trades",

        "Total Trades",

function renderLarge() {
  const trades =
    [...(state.trades || [])]
      .sort(
        (a, b) =>
          b.value - a.value
      )
      .slice(0, 100);

  if (!trades.length) {
    panelEl.innerHTML =
      `<div class="message">
        Large Trades داده‌ای ندارد
      </div>`;
    return;
  }

  const avg =
    trades.reduce(
      (s, x) =>
        s + Number(x.value || 0),
      0
    ) / trades.length;

  const threshold =
    Math.max(
      avg * 5,
      trades[0]?.value || 0
    );

  const rows =
    trades.map(t => `
      <tr>

        <td>
          ${new Date(
            t.time
          ).toLocaleTimeString(
            "en-US"
          )}
        </td>

        <td>
          ${n(t.price, 8)}
        </td>

        <td class="${
          t.side === "buy"
            ? "green"
            : "red"
        }">
          ${t.side.toUpperCase()}
        </td>

        <td>
          ${n(t.qty, 6)}
        </td>

        <td>
          ${n(t.value, 2)}
        </td>

        <td>
          ${
            t.value >= threshold
              ? "🐋 LARGE"
              : ""
          }
        </td>

      </tr>
    `).join("");

  panelEl.innerHTML = `
    <div class="panel-title">
      🐋 Large Trades
    </div>

    <div class="cards">

      ${card(
        "Largest Trade",
        n(
          state.tradeStats
            ?.largestTradeValue || 0,
          2
        )
      )}

      ${card(
        "Average Trade",
        n(
          state.tradeStats
            ?.averageTradeValue || 0,
          2
        )
      )}

      ${card(
        "Large Buy",
        n(
          state.tradeStats
            ?.largeBuyVolume || 0,
          6
        ),
        "green"
      )}

      ${card(
        "Large Sell",
        n(
          state.tradeStats
            ?.largeSellVolume || 0,
          6
        ),
        "red"
      )}

    </div>

    <div
      class="table-wrap"
      style="margin-top:10px"
    >
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Price</th>
            <th>Side</th>
            <th>Qty</th>
            <th>Value</th>
            <th>Type</th>
          </tr>
        </thead>

        <tbody>
          ${rows}
        </tbody>
      </table>
    </div>
  `;
}

async function boot() {
  try {
    const health =
      await api(
        "/api/health"
      );

    if (health.ok) {
      setStatus(
        "🟢 Worker آنلاین است — Bybit"
      );
    }
  } catch (e) {
    setStatus(
      "🔴 " +
      e.message,
      true
    );
  }

  await load();
}

boot();

setInterval(
  async () => {
    if (!state.loading) {
      await load();
    }
  },
  5000
);
</script>
