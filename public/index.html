<title>Absorption Zone Scanner</title>

<style>
*{

}

html,body{
  margin:0;
  padding:0;
  background:#070b12;
  color:#e5e7eb;
  font-family:
    Tahoma,
    Arial,
    sans-serif;
}

body{

}

button,
input,

}

button{
  cursor:pointer;
}

.app{
  width:min(1500px,100%);
  margin:auto;

}

.header{

  border-radius:18px;

.title{

}

.subtitle{

  margin-top:6px;
  font-size:13px;
}

.status{

  padding:10px 12px;
  border-radius:10px;
  background:#111827;
  border:1px solid #263244;
  font-size:13px;
}

.controls{
  display:grid;
  grid-template-columns:

    1fr
    auto;
  gap:8px;
  margin-bottom:12px;
}

.control{
  background:#0d1420;
  border:1px solid #1e293b;
  border-radius:14px;
  padding:10px;
}

.control label{
  display:block;
  color:#94a3b8;
  font-size:12px;
  margin-bottom:6px;
}

input,
select{

  border:1px solid #334155;

  color:#fff;

  padding:10px;

}

button{

  background:#172033;
  color:#fff;

}

button:hover{
  background:#202d44;
}

.refresh{

}

.refresh button{

}

.market{
  display:grid;
  grid-template-columns:

  gap:8px;
  margin-bottom:12px;
}

.metric{

  border:1px solid #1e293b;
  border-radius:14px;
  padding:12px;
}

.metric-name{

.metric-value{

.main{

}

}

.chart-title{

}

.chart-info{

  font-size:12px;

#chart{

}

.tab.active{

}

.panel{
  display:none;
  padding:12px;
}

.panel.active{
  display:block;
}

.panel-grid{
  display:grid;
  grid-template-columns:

.box-title{

.green{

}

.red{

}

.yellow{

}

.gray{
  color:#94a3b8;
}

.table-wrap{

  overflow:auto;

table{

th,

th{

<script>
"use strict";

const state = {
  data: null,

  zoom: 1,

  offset: 0,

  dragging: false,

  dragStartX: 0,

  startOffset: 0,

  selected: -1,

  heatmapHistory: [],

  lastUpdate: 0
};

const $ = id =>
  document.getElementById(id);

const API = location.origin;

function formatNumber(
  value,
  digits = 2
){
  const n = Number(value);

  if (!Number.isFinite(n)) {
    return "-";
  }

  return n.toLocaleString(
    "en-US",
    {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    }
  );
}

function formatCompact(value){
  const n = Number(value);

  if (!Number.isFinite(n)) {
    return "-";
  }

  const a = Math.abs(n);

  if (a >= 1000000000)
    return (n / 1000000000).toFixed(2) + "B";

  if (a >= 1000000)
    return (n / 1000000).toFixed(2) + "M";

  if (a >= 1000)
    return (n / 1000).toFixed(2) + "K";

  return n.toFixed(2);
}

function priceDigits(price){
  const p = Number(price);

  if (p >= 1000) return 2;
  if (p >= 1) return 4;
  if (p >= 0.01) return 6;

  return 8;
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function api(path){

  const url =
    `${API}${path}${path.includes("?") ? "&" : "?"}_=${Date.now()}`;

  const response =
    await fetch(
      url,
      {
        cache:"no-store"
      }
    );

  const text =
    await response.text();

  if (!text) {
    throw new Error(
      `پاسخ خالی (${response.status})`
    );
  }

  let data;

  try {
    data = JSON.parse(text);
  } catch(e) {
    throw new Error(
      `JSON نامعتبر: ${text.slice(0,180)}`
    );
  }

  if (!response.ok || data.ok === false) {
    throw new Error(
      data.error ||
      `HTTP ${response.status}`
    );
  }

  return data;
}

function setStatus(
  text,
  type=""
){
  const el = $("status");

  el.textContent = text;

  el.className =
    "status " + type;
}

async function load(){

  const symbol =
    $("symbol")
      .value
      .trim()
      .toUpperCase();

  const category =
    $("category").value;

  const interval =
    $("interval").value;

  if (!symbol) {
    $("symbol").value =
      "BTCUSDT";

    return load();
  }

  setStatus(
    "🟡 دریافت داده واقعی Bybit..."
  );

  try {

    const data =
      await api(
        `/api/market?symbol=${encodeURIComponent(symbol)}&category=${encodeURIComponent(category)}&interval=${encodeURIComponent(interval)}`
      );

    state.data = data;
    state.lastUpdate = Date.now();

    updateUI();

    setStatus(
      `🟢 اتصال برقرار است — Bybit · ${data.symbol}`
    );

  } catch(error) {

    console.error(error);

    setStatus(
      "🔴 " + error.message,
      "error"
    );
  }
}

function updateUI(){

  const d =
    state.data;

  if (!d) return;

  const price =
    d.ticker?.lastPrice || 0;

  $("price").textContent =
    formatNumber(
      price,
      priceDigits(price)
    );

  const change =
    Number(
      d.ticker?.price24hPcnt || 0
    );

  $("change").textContent =
    change.toFixed(2) + "%";

  $("change").className =
    "metric-value " +
    (
      change >= 0
        ? "green"
        : "red"
    );

  const stats =
    d.stats || {};

  $("delta").textContent =
    formatCompact(
      stats.delta
    );

  $("delta").className =
    "metric-value " +
    (
      stats.delta >= 0
        ? "green"
        : "red"
    );

  $("buySell").textContent =
    `${formatCompact(stats.buyVolume)} / ${formatCompact(stats.sellVolume)}`;

  const abs =
    d.absorption || {};

  $("absScore").textContent =
    abs.detected
      ? `${abs.side} · ${abs.score}`
      : "NONE";

  $("absScore").className =
    "metric-value " +
    (
      abs.side === "BUY"
        ? "green"
        : abs.side === "SELL"
          ? "red"
          : "gray"
    );

  drawChart();

  renderFootprint();

  renderHeatmap();

  renderLiquidity();

  renderAbsorption();

  renderOrderbook();

  renderDelta();

  renderLargeTrades();
}

function resizeCanvas(){

  const canvas =
    $("chart");

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    Math.floor(
      rect.width * dpr
    );

  canvas.height =
    Math.floor(
      rect.height * dpr
    );

  const ctx =
    canvas.getContext("2d");

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

function drawChart(){

  const canvas =
    $("chart");

  const rect =
    canvas.getBoundingClientRect();

  const W =
    rect.width;

  const H =
    rect.height;

  resizeCanvas();

  const ctx =
    canvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  const candles =
    state.data?.candles || [];

  if (!candles.length){
    return;
  }

  const visibleCount =
    Math.max(
      20,
      Math.floor(
        90 / state.zoom
      )
    );

  let end =
    candles.length -
    Math.round(
      state.offset
    );

  end =
    Math.max(
      visibleCount,
      Math.min(
        candles.length,
        end
      )
    );

  let start =
    Math.max(
      0,
      end - visibleCount
    );

  const visible =
    candles.slice(
      start,
      end
    );

  if (!visible.length) return;

  let min =
    Infinity;

  let max =
    -Infinity;

  for (const c of visible){

    min =
      Math.min(
        min,
        c.low
      );

    max =
      Math.max(
        max,
        c.high
      );
  }

  const range =
    Math.max(
      max - min,
      Number.EPSILON
    );

  const left = 55;
  const right = 15;
  const top = 15;
  const bottom = 35;

  const chartW =
    W - left - right;

  const chartH =
    H - top - bottom;

  function y(price){
    return (
      top +
      (
        max - price
      ) /
      range *
      chartH
    );
  }

  const candleW =
    chartW /
    visible.length;

  // Grid

  ctx.font =
    "10px Arial";

  ctx.lineWidth = 1;

  for (let i=0;i<=5;i++){

    const yy =
      top +
      i *
      chartH /
      5;

    ctx.strokeStyle =
      "#182334";

    ctx.beginPath();

    ctx.moveTo(
      left,
      yy
    );

    ctx.lineTo(
      W - right,
      yy
    );

    ctx.stroke();

    const p =
      max -
      range *
      i / 5;

    ctx.fillStyle =
      "#64748b";

    ctx.fillText(
      formatNumber(
        p,
        priceDigits(p)
      ),
      5,
      yy + 3
    );
  }

  visible.forEach(
    (c,i) => {

      const x =
        left +
        i * candleW +
        candleW / 2;

      const openY =
        y(c.open);

      const closeY =
        y(c.close);

      const highY =
        y(c.high);

      const lowY =
        y(c.low);

      const up =
        c.close >= c.open;

      ctx.strokeStyle =
        up
          ? "#22c55e"
          : "#ef4444";

      ctx.fillStyle =
        up
          ? "#22c55e"
          : "#ef4444";

      // Wick

      ctx.beginPath();

      ctx.moveTo(
        x,
        highY
      );

      ctx.lineTo(
        x,
        lowY
      );

      ctx.stroke();

      // Body

      const bodyTop =
        Math.min(
          openY,
          closeY
        );

      const bodyHeight =
        Math.max(
          1,
          Math.abs(
            closeY - openY
          )
        );

      ctx.fillRect(
        x - candleW * 0.32,
        bodyTop,
        candleW * 0.64,
        bodyHeight
      );

      // Selected

      const originalIndex =
        start + i;

      if (
        originalIndex ===
        state.selected
      ){

        ctx.strokeStyle =
          "#eab308";

        ctx.lineWidth = 2;

        ctx.strokeRect(
          x - candleW * 0.42,
          top,
          candleW * 0.84,
          chartH
        );

        ctx.lineWidth = 1;
      }

      // Volume

      const volumeMax =
        Math.max(
          ...visible.map(
            x => x.volume
          )
        );

      const vh =
        volumeMax > 0
          ? c.volume /
            volumeMax *
            35
          : 0;

      ctx.globalAlpha =
        0.22;

      ctx.fillRect(
        x - candleW * 0.32,
        H - bottom - vh,
        candleW * 0.64,
        vh
      );

      ctx.globalAlpha =
        1;
    }
  );

  // Last price

  const last =
    candles[candles.length - 1];

  const lastY =
    y(
      Math.max(
        min,
        Math.min(
          max,
          last.close
        )
      )
    );

  ctx.strokeStyle =
    "#94a3b8";

  ctx.setLineDash(
    [4,4]
  );

  ctx.beginPath();

  ctx.moveTo(
    left,
    lastY
  );

  ctx.lineTo(
    W-right,
    lastY
  );

  ctx.stroke();

  ctx.setLineDash([]);

  $("chartInfo").textContent =
    `${state.data.symbol} · ${state.data.interval}m · ${visible.length} candles`;
}

function selectCandleFromPointer(e){

  const canvas =
    $("chart");

  const rect =
    canvas.getBoundingClientRect();

  const candles =
    state.data?.candles || [];

  if (!candles.length) return;

  const visibleCount =
    Math.max(
      20,
      Math.floor(
        90 / state.zoom
      )
    );

  let end =
    candles.length -
    Math.round(
      state.offset
    );

  end =
    Math.max(
      visibleCount,
      Math.min(
        candles.length,
        end
      )
    );

  const start =
    Math.max(
      0,
      end - visibleCount
    );

  const x =
    e.clientX -
    rect.left;

  const left = 55;
  const right = 15;

  const chartW =
    rect.width -
    left -
    right;

  const candleW =
    chartW /
    visibleCount;

  let index =
    Math.floor(
      (x-left) /
      candleW
    );

  index =
    Math.max(
      0,
      Math.min(
        visibleCount - 1,
        index
      )
    );

  state.selected =
    Math.min(
      candles.length - 1,
      start + index
    );

  renderSelectedCandle();

  drawChart();
}

function renderSelectedCandle(){

  const index =
    state.selected;

  if (
    !state.data ||
    index < 0
  ) return;

  const c =
    state.data.candles[index];

  if (!c) return;

  $("chartInfo").textContent =
    `${new Date(c.time).toLocaleString()} · O ${formatNumber(c.open,priceDigits(c.open))} · H ${formatNumber(c.high,priceDigits(c.high))} · L ${formatNumber(c.low,priceDigits(c.low))} · C ${formatNumber(c.close,priceDigits(c.close))} · V ${formatCompact(c.volume)}`;
}

function renderHeatmap(){

  const book =
    state.data?.orderbook;

  if (!book){

    $("heatmap").innerHTML =
      `<div class="empty">
        داده Order Book موجود نیست
      </div>`;

    return;
  }

  const rows = [];

  const asks =
    book.asks || [];

  const bids =
    book.bids || [];

  const combined = [
    ...asks.slice(0,25).map(
      x => ({
        ...x,
        side:"ask"
      })
    ),
    ...bids.slice(0,25).map(
      x => ({
        ...x,
        side:"bid"
      })
    )
  ].sort(
    (a,b) =>
      b.value-a.value
  );

  let html =
    `<table>
      <thead>
        <tr>
          <th>Side</th>
          <th>Price</th>
          <th>Size</th>
          <th>Value</th>
          <th>Heat</th>
        </tr>
      </thead>
      <tbody>`;

  const max =
    Math.max(
      ...combined.map(
        x => x.value
      ),
      1
    );

  for (
    const x of combined
  ){

    const heat =
      Math.round(
        x.value /
        max *
        100
      );

    html +=
      `<tr>
        <td class="${
          x.side === "bid"
            ? "bid"
            : "ask"
        }">
          ${
            x.side === "bid"
              ? "BID"
              : "ASK"
          }
        </td>

        <td>
          ${formatNumber(
            x.price,
            priceDigits(x.price)
          )}
        </td>

        <td>
          ${formatCompact(
            x.size
          )}
        </td>

        <td>
          ${formatCompact(
            x.value
          )}
        </td>

        <td>
          ${heat}%
        </td>
      </tr>`;
  }

  html +=
    `</tbody></table>`;

  $("heatmap").innerHTML =
    html;
}

// Chart pointer

const chart =
  $("chart");

chart.addEventListener(
  "pointerdown",
  e => {

    state.dragging = true;

    state.dragStartX =
      e.clientX;

    state.startOffset =
      state.offset;

    chart.setPointerCapture(
      e.pointerId
    );
  }
);

chart.addEventListener(
  "pointermove",
  e => {

    if (!state.dragging)
      return;

    const rect =
      chart.getBoundingClientRect();

    const visibleCount =
      Math.max(
        20,
        Math.floor(
          90 / state.zoom
        )
      );

    const dx =
      e.clientX -
      state.dragStartX;

    const candleWidth =
      (
        rect.width - 70
      ) /
      visibleCount;

    state.offset =
      state.startOffset -
      dx /
      candleWidth;

    const maxOffset =
      Math.max(
        0,
        (state.data?.candles?.length || 0)
        - visibleCount
      );

    state.offset =
      Math.max(
        0,
        Math.min(
          maxOffset,
          state.offset
        )
      );

    drawChart();
  }
);

chart.addEventListener(
  "pointerup",
  e => {

    state.dragging = false;

    try {
      chart.releasePointerCapture(
        e.pointerId
      );
    } catch {}
  }
);

chart.addEventListener(
  "pointercancel",
  () => {
    state.dragging = false;
  }
);

chart.addEventListener(
  "click",
  e => {
    if (!state.dragging){
      selectCandleFromPointer(e);
    }
  }
);

chart.addEventListener(
  "wheel",
  e => {

    e.preventDefault();

    const old =
      state.zoom;

    if (e.deltaY < 0){
      state.zoom =
        Math.min(
          5,
          state.zoom * 1.15
        );
    } else {
      state.zoom =
        Math.max(
          0.5,
          state.zoom / 1.15
        );
    }

    if (
      old !== state.zoom
    ){
      drawChart();
    }
  },
  {
    passive:false
  }
);

window.addEventListener(
  "resize",
  () => {

    if (state.data){
      drawChart();
    }
  }
);

// Live update

setInterval(

  5000
);
