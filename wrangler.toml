name = "absorption-zone-scanner"
main = "worker.js"
compatibility_date = "2026-09-05"

workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "TRADE_COLLECTOR"
class_name = "TradeCollector"

[exports.TradeCollector]
type = "durable-object"
storage = "sqlite"

[exports.CollectorDO]
type = "durable-object"
state = "deleted"

[triggers]
crons = ["*/5 * * * *"]
