name: Deploy Absorption Zone Scanner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deployment Summary
        if: always()
        run: |
          {
            echo "## Cloudflare Deployment"
            echo ""
            echo "Workflow reached the deployment step."
            echo "See the Build & Deploy Worker step above for Wrangler output."
          } >> "$GITHUB_STEP_SUMMARY"
