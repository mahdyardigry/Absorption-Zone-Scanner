name: Deploy Absorption Zone Scanner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy > deploy-error.log 2>&1
      - name: Show Wrangler log
        if: always()
        run: cat deploy-error.log
      - name: Upload Wrangler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-deploy-log
          path: deploy-error.log
