name: Deploy Absorption Zone Scanner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Set V6.4.4 Upload Secret
        env:
          V6_4_4_UPLOAD_SECRET: ${{ secrets.V6_4_4_UPLOAD_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$V6_4_4_UPLOAD_SECRET" ]; then
            printf '%s' "$V6_4_4_UPLOAD_SECRET" | wrangler secret put V6_4_4_UPLOAD_SECRET
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          wrangler deploy 2>&1 | tee deploy-output.log
          status=${PIPESTATUS[0]}

          {
            echo "## Wrangler Deploy Output"
            echo '```text'
            cat deploy-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: Deployment Summary
        if: always()
        run: |
          echo "Deploy workflow finished."
